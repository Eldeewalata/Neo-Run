<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEO RUN: NAIJA 5D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07130d;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  z-index:10;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.box{
  background:rgba(0,0,0,.48);
  color:white;
  padding:8px 11px;
  border-radius:12px;
  font-size:12px;
  font-weight:bold;
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(5px);
}

#sound{
  position:absolute;
  z-index:20;
  right:12px;
  top:58px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:20px;
}

.overlay{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:rgba(0,15,8,.48);
}

.panel{
  width:min(420px,94%);
  padding:28px 20px;
  text-align:center;
  color:white;
  border-radius:25px;
  background:rgba(3,17,9,.88);
  border:1px solid rgba(80,255,140,.3);
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.logo{
  font-size:33px;
  font-weight:1000;
  color:#65ff91;
  text-shadow:0 0 25px rgba(50,255,100,.3);
}

.sub{
  margin-top:8px;
  color:#ddd;
  font-size:13px;
}

.flag{
  width:72px;
  height:38px;
  display:flex;
  margin:17px auto;
  border-radius:6px;
  overflow:hidden;
}

.flag i{
  flex:1;
}

.flag i:nth-child(1),
.flag i:nth-child(3){
  background:#008751;
}

.flag i:nth-child(2){
  background:white;
}

.title{
  color:#aaa;
  font-size:11px;
  letter-spacing:2px;
  margin-bottom:8px;
}

.levels{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.level{
  flex:1;
  padding:12px 3px;
  border:1px solid #34503d;
  background:#142119;
  color:white;
  border-radius:11px;
  font-weight:bold;
}

.level.active{
  background:#008751;
  border-color:#70ff9c;
}

#start,#again{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#00a85a,#006e36);
  color:white;
  font-size:17px;
  font-weight:900;
}

.hidden{
  display:none;
}

#controls{
  position:absolute;
  z-index:15;
  bottom:17px;
  left:0;
  right:0;
  display:flex;
  justify-content:space-between;
  padding:0 16px;
  pointer-events:none;
}

.group{
  display:flex;
  gap:9px;
}

.control{
  width:62px;
  height:62px;
  border-radius:18px;
  background:rgba(0,0,0,.43);
  border:1px solid rgba(255,255,255,.22);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  pointer-events:auto;
  user-select:none;
}

#jump{
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,135,81,.72);
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="box">🇳🇬 NEO RUN 5D</div>
  <div class="box">₦ <span id="coins">0</span></div>
  <div class="box">SCORE <span id="score">0</span></div>
</div>

<button id="sound">🔊</button>

<div id="startScreen" class="overlay">
  <div class="panel">

    <div class="logo">NEO RUN: NAIJA</div>

    <div class="sub">
      5D STREET RUNNER
    </div>

    <div class="flag">
      <i></i><i></i><i></i>
    </div>

    <div class="title">SELECT DIFFICULTY</div>

    <div class="levels">
      <button class="level active" data-level="easy">EASY</button>
      <button class="level" data-level="normal">NORMAL</button>
      <button class="level" data-level="hard">HARD</button>
    </div>

    <button id="start">▶ START RUN</button>

    <div style="margin-top:12px;color:#7dffab;font-size:12px">
      🎵 Afrobeats instrumental mode
    </div>

      No engine buzzing • Move • Jump • Collect ₦
    </div>

  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="panel">

    <div class="logo">GAME OVER</div>

    <div style="margin-top:15px;color:#bbb">
      SCORE
    </div>

    <div id="final"
         style="font-size:45px;font-weight:1000;margin:5px">
      0
    </div>

    <div style="color:#70ff9c;font-size:13px">
      BEST: <span id="best">0</span>
    </div>

    <br>

    <button id="again">↻ RUN AGAIN</button>

  </div>
</div>

<div id="controls">

  <div class="group">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
  </div>

  <div class="group">
    <div class="control" id="jump">▲</div>
  </div>

</div>

</div>

<script>
"use strict";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H,DPR;

function resize(){

  W=innerWidth;
  H=innerHeight;

  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* =====================================================
   GAME SETTINGS
===================================================== */

const levels={

  easy:{
    speed:2.35,
    max:3.65,
    spawn:1.45
  },

  normal:{
    speed:3.05,
    max:4.8,
    spawn:1.2
  },

  hard:{
    speed:3.8,
    max:6,
    spawn:.9
  }

};

let selected="easy";
let setting=levels.easy;

let running=false;
let speed=setting.speed;

let score=0;
let coins=0;

let objects=[];
let particles=[];

let spawnTimer=0;
let coinTimer=0;

let roadMove=0;

let best=Number(
  localStorage.getItem("neo5DBest")||0
);

/* =====================================================
   AUDIO
   Afrobeats-style instrumental
   NO BUZZING
===================================================== */

let audio=null;
let musicTimer=null;
let musicStep=0;
let soundOn=true;

function audioStart(){

  if(!soundOn)return;

  try{

    if(!audio){

      audio=new(
        window.AudioContext||
        window.webkitAudioContext
      )();
    }

    if(audio.state==="suspended"){
      audio.resume();
    }

  }catch(e){
    audio=null;
  }
}

function note(
  frequency,
  duration,
  type="sine",
  volume=.045
){

  if(!soundOn||!audio)return;

  const now=audio.currentTime;

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.type=type;
  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(.0001,now);

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start(now);
  osc.stop(now+duration+.03);
}

/*
   Simple original rhythm pattern.
   This is deliberately not a buzzing engine sound.
*/

function startMusic(){

  if(!soundOn||!audio)return;

  stopMusic();

  musicStep=0;

  musicTimer=setInterval(()=>{

    if(!running)return;

    const s=musicStep%16;

    /* bass */

    if(s===0||s===8){
      note(110,.13,"sine",.055);
    }

    /* kick-like low note */

    if(s===4||s===12){
      note(80,.09,"triangle",.045);
    }

    /* melody */

    if(s===2){
      note(330,.09,"triangle",.025);
    }

    if(s===6){
      note(392,.09,"triangle",.025);
    }

    if(s===10){
      note(330,.09,"triangle",.025);
    }

    if(s===14){
      note(440,.1,"triangle",.028);
    }

    /* hi percussion */

    if([1,3,5,7,9,11,13,15].includes(s)){
      note(900,.025,"square",.009);
    }

    musicStep++;

  },115);
}

function stopMusic(){

  if(musicTimer){

    clearInterval(musicTimer);
    musicTimer=null;
  }
}

/* Effects only */

function coinSound(){

  note(900,.07,"sine",.06);

  setTimeout(()=>{
    note(1250,.09,"sine",.045);
  },50);
}

function jumpSound(){

  note(430,.1,"square",.045);
  setTimeout(()=>{
    note(650,.1,"square",.035);
  },70);
}

function crashSound(){

  note(75,.22,"sawtooth",.09);
  setTimeout(()=>{
    note(48,.25,"triangle",.07);
  },80);
}

/* =====================================================
   PLAYER
===================================================== */

const player={

  lane:1,
  target:1,

  x:0,

  jump:0,
  jumpVelocity:0,

  animation:0

};

/* =====================================================
   PERSPECTIVE
===================================================== */

function horizon(){
  return H*.37;
}

function bottomRoad(){
  return H*1.08;
}

function roadWidth(z){

  const top=W*.11;
  const bottom=W*1.12;

  return top+(bottom-top)*z;
}

function roadLeft(z){

  return W/2-roadWidth(z)/2;
}

function laneX(lane,z){

  return roadLeft(z)+
    roadWidth(z)*((lane+.5)/3);
}

function worldY(z){

  return horizon()+
    (bottomRoad()-horizon())*
    Math.pow(z,1.72);
}

/* =====================================================
   OBJECTS
===================================================== */

function obstacle(){

  const r=Math.random();

  let type="danfo";

  if(r>.52&&r<.82){
    type="keke";
  }

  if(r>=.82){
    type="car";
  }

  objects.push({
    type:type,
    lane:Math.floor(Math.random()*3),
    z:.02
  });
}

function coin(){

  objects.push({
    type:"coin",
    lane:Math.floor(Math.random()*3),
    z:.01
  });
}

/* =====================================================
   DRAW BACKGROUND
===================================================== */

function sky(){

  const g=ctx.createLinearGradient(
    0,0,0,H
  );

  g.addColorStop(0,"#39baf1");
  g.addColorStop(.48,"#9be7ff");
  g.addColorStop(1,"#f2c976");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* sun */

  ctx.fillStyle="rgba(255,224,100,.8)";

  ctx.beginPath();
  ctx.arc(W*.82,H*.15,42,0,Math.PI*2);
  ctx.fill();

  cloud(W*.14,H*.14,1);
  cloud(W*.58,H*.1,.7);
}

function cloud(x,y,s){

  ctx.fillStyle="rgba(255,255,255,.8)";

  ctx.beginPath();

  ctx.arc(x,y,18*s,0,Math.PI*2);
  ctx.arc(x+22*s,y-8*s,25*s,0,Math.PI*2);
  ctx.arc(x+45*s,y,18*s,0,Math.PI*2);

  ctx.fill();
}

/* =====================================================
   5D DEPTH CITY
===================================================== */

function city(){

  const hy=horizon();

  /*
     Multiple depth layers create the
     5D-style parallax effect.
  */

  for(let layer=0;layer<3;layer++){

    const depth=.35+layer*.25;

    ctx.globalAlpha=.55+layer*.15;

    for(let i=0;i<12;i++){

      const x=
        (i/12)*W+
        Math.sin(i*8+layer)*10;

      const width=
        35+
        ((i*17)%45);

      const height=
        (30+(i*19)%65)*depth;

      ctx.fillStyle=[
        "#8e5545",
        "#bd7650",
        "#d49b59"
      ][layer];

      ctx.fillRect(
        x,
        hy-height,
        width,
        height
      );

      ctx.fillStyle="rgba(255,220,140,.5)";

      for(
        let yy=hy-height+10;
        yy<hy-5;
        yy+=15
      ){

        ctx.fillRect(
          x+7,
          yy,
          5,
          6
        );
      }
    }
  }

  ctx.globalAlpha=1;
}

/* =====================================================
   PALM TREES
===================================================== */

function palm(x,y,s){

  ctx.strokeStyle="#604327";
  ctx.lineWidth=5*s;

  ctx.beginPath();

  ctx.moveTo(x,y);

  ctx.quadraticCurveTo(
    x-5*s,
    y-40*s,
    x+2*s,
    y-70*s
  );

  ctx.stroke();

  ctx.fillStyle="#087c3f";

  for(let i=0;i<8;i++){

    const a=i*Math.PI/4;

    ctx.beginPath();

    ctx.moveTo(
      x+2*s,
      y-70*s
    );

    ctx.lineTo(
      x+2*s+Math.cos(a)*38*s,
      y-70*s+Math.sin(a)*22*s
    );

    ctx.lineTo(
      x+2*s+Math.cos(a+.2)*27*s,
      y-70*s+Math.sin(a+.2)*18*s
    );

    ctx.fill();
  }
}

/* =====================================================
   ROADSIDE
===================================================== */

function roadside(){

  const hy=horizon();

  ctx.fillStyle="#4d913c";

  ctx.fillRect(
    0,
    hy,
    W,
    H-hy
  );

  city();

  palm(W*.05,hy+72,1);
  palm(W*.95,hy+80,.85);

  /* Nigerian fuel station */

  const x=W*.72;
  const y=hy+8;

  ctx.fillStyle="#eee";

  ctx.fillRect(x,y,65,42);

  ctx.fillStyle="#008751";

  ctx.fillRect(x-4,y,73,9);

  ctx.fillStyle="#111";

  ctx.font="bold 9px Arial";

  ctx.fillText(
    "NAIJA FUEL",
    x+7,
    y+27
  );

  /* billboard */

  ctx.fillStyle="#333";

  ctx.fillRect(
    W*.26,
    hy+3,
    4,
    42
  );

  ctx.fillStyle="#008751";

  ctx.fillRect(
    W*.20,
    hy-5,
    100,
    30
  );

  ctx.fillStyle="white";

  ctx.font="bold 12px Arial";

  ctx.fillText(
    "WELCOME TO NAIJA",
    W*.205,
    hy+14
  );
}

/* =====================================================
   ROAD
===================================================== */

function road(){

  const hy=horizon();

  const lt=W/2-W*.055;
  const rt=W/2+W*.055;

  const lb=-W*.05;
  const rb=W*1.05;

  /* road shadow underneath */

  ctx.fillStyle="rgba(0,0,0,.25)";

  ctx.beginPath();

  ctx.moveTo(lt-7,hy);
  ctx.lineTo(rt+7,hy);
  ctx.lineTo(rb+8,H);
  ctx.lineTo(lb-8,H);

  ctx.fill();

  /* asphalt */

  const g=ctx.createLinearGradient(
    0,hy,
    0,H
  );

  g.addColorStop(0,"#454b4f");
  g.addColorStop(.55,"#25292c");
  g.addColorStop(1,"#141719");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(lt,hy);
  ctx.lineTo(rt,hy);
  ctx.lineTo(rb,H);
  ctx.lineTo(lb,H);

  ctx.closePath();
  ctx.fill();

  /* yellow road edges */

  ctx.strokeStyle="#ffd72f";
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.moveTo(lt,hy);
  ctx.lineTo(lb,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(rt,hy);
  ctx.lineTo(rb,H);
  ctx.stroke();

  /* moving lane lines */

  for(let i=0;i<15;i++){

    let z=
      ((i/15)+(roadMove*.014))%1;

    let z2=Math.min(z+.045,1);

    const y1=worldY(z);
    const y2=worldY(z2);

    for(let lane=1;lane<=2;lane++){

      const x1=
        roadLeft(z)+
        roadWidth(z)*(lane/3);

      const x2=
        roadLeft(z2)+
        roadWidth(z2)*(lane/3);

      ctx.strokeStyle="rgba(255,255,255,.75)";

      ctx.lineWidth=1.5+z*5;

      ctx.beginPath();

      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);

      ctx.stroke();
    }
  }

  /*
     Perspective light strips.
  */

  ctx.fillStyle="rgba(255,255,255,.025)";

  for(let i=0;i<4;i++){

    const z=i/4;

    const l=roadLeft(z);
    const w=roadWidth(z);

    ctx.beginPath();

    ctx.moveTo(
      l+w*.43,
      worldY(z)
    );

    ctx.lineTo(
      l+w*.48,
      worldY(z)
    );

    ctx.lineTo(
      l+w*.55,
      worldY(Math.min(1,z+.18))
    );

    ctx.lineTo(
      l+w*.50,
      worldY(Math.min(1,z+.18))
    );

    ctx.fill();
  }
}

/* =====================================================
   VEHICLES
===================================================== */

function wheel(x,y,s){

  ctx.fillStyle="#101010";

  ctx.beginPath();
  ctx.arc(x,y,10*s,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#aaa";

  ctx.beginPath();
  ctx.arc(x,y,4*s,0,Math.PI*2);
  ctx.fill();
}

function vehicle(x,y,s,type){

  ctx.save();

  ctx.translate(x,y);

  /* deep shadow */

  ctx.fillStyle="rgba(0,0,0,.4)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    25*s,
    42*s,
    11*s,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  if(type==="danfo"){

    /* 3D lower body */

    ctx.fillStyle="#cba81d";

    ctx.beginPath();

    ctx.moveTo(-35*s,-45*s);
    ctx.lineTo(35*s,-45*s);
    ctx.lineTo(32*s,28*s);
    ctx.lineTo(-32*s,28*s);

    ctx.closePath();
    ctx.fill();

    /* front */

    ctx.fillStyle="#f5d32c";

    ctx.fillRect(
      -35*s,
      -45*s,
      70*s,
      55*s
    );

    /* green stripe */

    ctx.fillStyle="#087c3f";

    ctx.fillRect(
      -35*s,
      -13*s,
      70*s,
      12*s
    );

    /* windshield */

    ctx.fillStyle="#172d38";

    ctx.beginPath();

    ctx.moveTo(-28*s,-39*s);
    ctx.lineTo(28*s,-39*s);
    ctx.lineTo(22*s,-19*s);
    ctx.lineTo(-22*s,-19*s);

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#8dd8ed";

    ctx.fillRect(
      -20*s,
      -35*s,
      17*s,
      12*s
    );

    ctx.fillRect(
      3*s,
      -35*s,
      17*s,
      12*s
    );

    wheel(-25*s,23*s,s);
    wheel(25*s,23*s,s);

    ctx.fillStyle="white";

    ctx.font=`bold ${7*s}px Arial`;
    ctx.textAlign="center";

    ctx.fillText(
      "LAGOS",
      0,
      2*s
    );

  }else if(type==="keke"){

    ctx.fillStyle="#087c3f";

    ctx.fillRect(
      -30*s,
      -32*s,
      60*s,
      55*s
    );

    ctx.fillStyle="#e8e8e8";

    ctx.beginPath();

    ctx.moveTo(-29*s,-32*s);
    ctx.lineTo(0,-57*s);
    ctx.lineTo(29*s,-32*s);

    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#17313a";

    ctx.fillRect(
      -19*s,
      -27*s,
      38*s,
      20*s
    );

    wheel(-22*s,20*s,s);
    wheel(22*s,20*s,s);

  }else{

    ctx.fillStyle="#d63a42";

    ctx.beginPath();

    ctx.moveTo(-34*s,-42*s);
    ctx.lineTo(34*s,-42*s);
    ctx.lineTo(31*s,25*s);
    ctx.lineTo(-31*s,25*s);

    ctx.closePath();

    ctx.fill();

    ctx.fillStyle="#182d38";

    ctx.fillRect(
      -26*s,
      -34*s,
      52*s,
      24*s
    );

    ctx.fillStyle="#8bd5e8";

    ctx.fillRect(
      -21*s,
      -31*s,
      19*s,
      15*s
    );

    ctx.fillRect(
      2*s,
      -31*s,
      19*s,
      15*s
    );

    wheel(-25*s,21*s,s);
    wheel(25*s,21*s,s);
  }

  ctx.restore();
}

/* =====================================================
   COINS
===================================================== */

function drawCoin(x,y,s){

  const spin=
    Math.abs(
      Math.sin(performance.now()/150)
    );

  ctx.save();

  ctx.translate(x,y);

  ctx.scale(
    .35+spin*.65,
    1
  );

  ctx.shadowBlur=15*s;
  ctx.shadowColor="#ffd62e";

  ctx.fillStyle="#ffd52e";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    17*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  ctx.strokeStyle="#fff2a0";
  ctx.lineWidth=2*s;

  ctx.stroke();

  ctx.fillStyle="#087c3f";

  ctx.font=`bold ${14*s}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText("₦",0,1);

  ctx.restore();
}

/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

  const x=player.x;
  const y=
    worldY(.95)-
    player.jump;

  const bob=
    Math.sin(player.animation)*2;

  ctx.save();

  ctx.translate(x,y+bob);

  /* glow/shadow */

  ctx.fillStyle="rgba(0,0,0,.4)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    12,
    30,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* legs */

  ctx.strokeStyle="#172019";
  ctx.lineWidth=8;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-8,-2);
  ctx.lineTo(-11,25);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(8,-2);
  ctx.lineTo(12,25);
  ctx.stroke();

  /* shoes */

  ctx.fillStyle="#111";

  ctx.fillRect(-20,20,18,8);
  ctx.fillRect(5,20,18,8);

  /* body */

  const bodyGrad=ctx.createLinearGradient(
    -20,-45,
    20,0
  );

  bodyGrad.addColorStop(0,"#12a94f");
  bodyGrad.addColorStop(1,"#005d2e");

  ctx.fillStyle=bodyGrad;

  roundRect(
    -20,-48,
    40,49,
    10,
    true
  );

  /* Nigerian white stripe */

  ctx.fillStyle="white";

  ctx.fillRect(
    -20,-25,
    40,10
  );

  /* arms */

  ctx.strokeStyle="#9a603d";
  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(-17,-38);
  ctx.lineTo(-29,-14);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(17,-38);
  ctx.lineTo(29,-14);
  ctx.stroke();

  /* head */

  ctx.fillStyle="#9a603d";

  ctx.beginPath();

  ctx.arc(
    0,
    -62,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* hair */

  ctx.fillStyle="#15100d";

  ctx.beginPath();

  ctx.arc(
    0,
    -67,
    18,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();

  /* eyes */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(-6,-62,2,0,Math.PI*2);
  ctx.arc(6,-62,2,0,Math.PI*2);

  ctx.fill();

  ctx.restore();
}

/* =====================================================
   PARTICLES
===================================================== */

function particle(x,y){

  particles.push({
    x:x,
    y:y,
    vx:(Math.random()-.5)*3,
    vy:(Math.random()-.5)*3,
    life:1
  });
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt*20;
    p.y+=p.vy*dt*20;

    p.life-=.05*dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=p.life;

    ctx.fillStyle="#ffd52e";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  speed+=.009*dt;

  if(speed>setting.max){
    speed=setting.max;
  }

  roadMove+=speed*dt;

  score+=speed*dt*1.35;

  /* player */

  const targetX=
    laneX(player.target,.95);

  player.x+=
    (targetX-player.x)*
    Math.min(1,.2*dt);

  player.animation+=.16*dt;

  /* jump */

  if(
    player.jump>0||
    player.jumpVelocity>0
  ){

    player.jump+=
      player.jumpVelocity*dt;

    player.jumpVelocity-=.9*dt;

    if(player.jump<=0){

      player.jump=0;
      player.jumpVelocity=0;
    }
  }

  /* spawn */

  spawnTimer-=dt/60;
  coinTimer-=dt/60;

  if(spawnTimer<=0){

    obstacle();

    spawnTimer=
      setting.spawn*
      (.8+Math.random()*.45);
  }

  if(coinTimer<=0){

    coin();

    coinTimer=
      .6+
      Math.random()*.45;
  }

  /* objects */

  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    o.z+=speed*.0092*dt;

    if(o.z>1.12){

      objects.splice(i,1);
      continue;
    }

    if(
      o.z>.82&&
      o.z<1.02&&
      o.lane===player.target
    ){

      const x=laneX(o.lane,o.z);
      const y=worldY(o.z);

      if(o.type==="coin"){

        coins++;
        score+=35;

        coinSound();

        for(let j=0;j<9;j++){
          particle(x,y);
        }

        objects.splice(i,1);

      }else{

        /*
          Jumping high enough clears
          the vehicle.
        */

        if(player.jump<30){

          gameOver();
          return;
        }
      }
    }
  }

  updateParticles(dt);

  document.getElementById("score").textContent=
    Math.floor(score);

  document.getElementById("coins").textContent=
    coins;
}

/* =====================================================
   DRAW OBJECTS
===================================================== */

function objectsDraw(){

  const sorted=
    [...objects].sort(
      (a,b)=>a.z-b.z
    );

  for(const o of sorted){

    const x=laneX(o.lane,o.z);
    const y=worldY(o.z);

    const s=.17+o.z*1.02;

    if(o.type==="coin"){

      drawCoin(
        x,
        y-22*s,
        s
      );

    }else{

      vehicle(
        x,
        y,
        s,
        o.type
      );
    }
  }
}

/* =====================================================
   MAIN DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  sky();

  roadside();

  road();

  objectsDraw();

  drawPlayer();

  drawParticles();

  if(running){

    ctx.fillStyle="rgba(0,0,0,.35)";

    roundRect(
      12,
      H-104,
      115,
      27,
      8,
      true
    );

    ctx.fillStyle="white";

    ctx.font="bold 11px Arial";

    ctx.fillText(
      selected.toUpperCase()+
      " • "+speed.toFixed(1),
      22,
      H-86
    );
  }
}

/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
  x,y,w,h,r,fill
){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(
    x+w,y,
    x+w,y+r
  );

  ctx.lineTo(
    x+w,
    y+h-r
  );

  ctx.quadraticCurveTo(
    x+w,
    y+h,
    x+w-r,
    y+h
  );

  ctx.lineTo(
    x+r,
    y+h
  );

  ctx.quadraticCurveTo(
    x,
    y+h,
    x,
    y+h-r
  );

  ctx.lineTo(
    x,
    y+r
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x+r,
    y
  );

  if(fill)ctx.fill();
}

/* =====================================================
   START / GAME OVER
===================================================== */

function reset(){

  objects=[];
  particles=[];

  score=0;
  coins=0;

  speed=setting.speed;

  spawnTimer=.7;
  coinTimer=.4;

  roadMove=0;

  player.lane=1;
  player.target=1;
  player.x=laneX(1,.95);

  player.jump=0;
  player.jumpVelocity=0;

  document.getElementById("score").textContent="0";
  document.getElementById("coins").textContent="0";
}

function startGame(){

  audioStart();

  reset();

  running=true;

  document
    .getElementById("startScreen")
    .classList.add("hidden");

  document
    .getElementById("gameOver")
    .classList.add("hidden");

  startMusic();

  last=performance.now();

  requestAnimationFrame(loop);
}

function gameOver(){

  if(!running)return;

  running=false;

  stopMusic();

  crashSound();

  const final=Math.floor(score);

  document.getElementById("final").textContent=
    final;

  if(final>best){

    best=final;

    localStorage.setItem(
      "neo5DBest",
      best
    );
  }

  document.getElementById("best").textContent=
    best;

  document
    .getElementById("gameOver")
    .classList.remove("hidden");
}

/* =====================================================
   LOOP
===================================================== */

let last=0;

function loop(now){

  if(!running){

    draw();
    return;
  }

  let dt=(now-last)/16.67;

  if(dt>2)dt=2;
  if(dt<0)dt=0;

  last=now;

  update(dt);

  draw();

  if(running){
    requestAnimationFrame(loop);
  }
}

/* =====================================================
   CONTROLS
===================================================== */

function left(){

  if(!running)return;

  player.target=
    Math.max(
      0,
      player.target-1
    );
}

function right(){

  if(!running)return;

  player.target=
    Math.min(
      2,
      player.target+1
    );
}

function jump(){

  if(!running)return;

  if(player.jump===0){

    player.jump=1;
    player.jumpVelocity=10;

    jumpSound();
  }
}

function control(id,fn){

  const el=document.getElementById(id);

  el.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      fn();
    },
    {passive:false}
  );
}

control("left",left);
control("right",right);
control("jump",jump);

/* Keyboard */

addEventListener("keydown",e=>{

  if(
    e.key==="ArrowLeft"||
    e.key.toLowerCase()==="a"
  ){
    left();
  }

  if(
    e.key==="ArrowRight"||
    e.key.toLowerCase()==="d"
  ){
    right();
  }

  if(
    e.key==="ArrowUp"||
    e.key===" "||
    e.key.toLowerCase()==="w"
  ){
    jump();
  }
});

/* =====================================================
   SWIPE
===================================================== */

let sx=0;
let sy=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    sx=t.clientX;
    sy=t.clientY;

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  e=>{

    const t=e.changedTouches[0];

    const dx=t.clientX-sx;
    const dy=t.clientY-sy;

    if(Math.abs(dx)>35){

      dx>0?right():left();

    }else if(dy<-35){

      jump();
    }

  },
  {passive:true}
);

/* =====================================================
   DIFFICULTY
===================================================== */

document.querySelectorAll(".level")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    document
      .querySelectorAll(".level")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    selected=btn.dataset.level;

    setting=levels[selected];
  });
});

/* =====================================================
   START BUTTON
===================================================== */

let starting=false;

function begin(e){

  e.preventDefault();

  if(starting)return;

  starting=true;

  startGame();

  setTimeout(()=>{
    starting=false;
  },500);
}

document
  .getElementById("start")
  .addEventListener(
    "pointerdown",
    begin,
    {passive:false}
  );

document
  .getElementById("again")
  .addEventListener(
    "pointerdown",
    begin,
    {passive:false}
  );

/* =====================================================
   SOUND TOGGLE
===================================================== */

document
  .getElementById("sound")
  .addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      soundOn=!soundOn;

      document.getElementById("sound")
        .textContent=
        soundOn?"🔊":"🔇";

      if(soundOn){

        audioStart();

        if(running){
          startMusic();
        }

      }else{

        stopMusic();
      }

    },
    {passive:false}
  );

/* =====================================================
   INITIAL
===================================================== */

player.x=laneX(1,.95);

draw();

</script>
