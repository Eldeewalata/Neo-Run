<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Neo Run: Naija 3D V4</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.box{
  background:rgba(0,0,0,.62);
  color:white;
  border:1px solid rgba(255,255,255,.25);
  border-radius:12px;
  padding:8px 12px;
  font-size:13px;
  margin-bottom:5px;
}

#version{
  position:fixed;
  top:105px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  background:rgba(0,0,0,.7);
  color:#00ffcc;
  padding:6px 12px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

#message{
  position:fixed;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  z-index:30;
  color:white;
  text-align:center;
  background:rgba(0,0,0,.82);
  padding:25px;
  border-radius:20px;
  width:85%;
  max-width:400px;
}

#message h1{
  font-size:30px;
  margin-bottom:10px;
}

#message p{
  font-size:14px;
  line-height:1.5;
}

#start{
  margin-top:18px;
  border:0;
  border-radius:30px;
  padding:14px 35px;
  font-size:17px;
  font-weight:bold;
  background:#00d084;
  color:white;
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  justify-content:space-around;
  pointer-events:none;
}

.control{
  width:70px;
  height:55px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.55);
  color:white;
  font-size:25px;
  pointer-events:auto;
  touch-action:none;
}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.78);
  color:white;
  text-align:center;
  padding-top:30vh;
}

#gameover h1{
  font-size:40px;
  margin-bottom:12px;
}

#restart{
  margin-top:20px;
  padding:14px 35px;
  border:0;
  border-radius:25px;
  font-size:17px;
  font-weight:bold;
  background:#00d084;
  color:white;
}

.power{
  color:#ffe600;
}
</style>
</head>

<body>

<div id="hud">
  <div>
    <div class="box">🏃 Score: <span id="score">0</span></div>
    <div class="box">🪙 Coins: <span id="coins">0</span></div>
  </div>

  <div>
    <div class="box">❤️ Lives: <span id="lives">3</span></div>
    <div class="box">⚡ Speed: <span id="speed">1</span></div>
  </div>
</div>

<div id="version">NEO RUN: NAIJA • 3D V4 LOADED</div>

<div id="message">
  <h1>🇳🇬 NEO RUN</h1>
  <p>
    Run through the Nigerian city.<br>
    Collect coins, avoid traffic and grab power-ups.
  </p>
  <button id="start">START RUN</button>
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="jump">▲</button>
  <button class="control" id="slide">▼</button>
  <button class="control" id="right">▶</button>
</div>

<div id="gameover">
  <h1>GAME OVER</h1>
  <p>Score: <span id="finalScore">0</span></p>
  <p>Coins: <span id="finalCoins">0</span></p>
  <button id="restart">RUN AGAIN</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.1/+esm";

/* =========================
   DOM
========================= */

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const livesEl = document.getElementById("lives");
const speedEl = document.getElementById("speed");

const message = document.getElementById("message");
const startBtn = document.getElementById("start");

const gameover = document.getElementById("gameover");
const restartBtn = document.getElementById("restart");

const leftBtn = document.getElementById("left");
const rightBtn = document.getElementById("right");
const jumpBtn = document.getElementById("jump");
const slideBtn = document.getElementById("slide");

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x75cfff);

scene.fog = new THREE.Fog(
  0x75cfff,
  35,
  190
);

/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  500
);

camera.position.set(
  0,
  5.3,
  10
);

/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* =========================
   LIGHTING
========================= */

const ambient =
  new THREE.HemisphereLight(
    0xffffff,
    0x446644,
    2
  );

scene.add(ambient);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  -20,
  40,
  20
);

sun.castShadow = true;

scene.add(sun);

/* =========================
   MATERIALS
========================= */

const roadMat =
  new THREE.MeshStandardMaterial({
    color:0x242424,
    roughness:.9
  });

const grassMat =
  new THREE.MeshStandardMaterial({
    color:0x23852d
  });

const yellowMat =
  new THREE.MeshStandardMaterial({
    color:0xffd500,
    emissive:0x442200
  });

const whiteMat =
  new THREE.MeshStandardMaterial({
    color:0xffffff
  });

/* =========================
   ROAD
========================= */

const road =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      14,
      .3,
      500
    ),
    roadMat
  );

road.position.set(
  0,
  -1,
  -180
);

road.receiveShadow = true;

scene.add(road);

/* =========================
   GRASS
========================= */

const grass =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      90,
      .25,
      500
    ),
    grassMat
  );

grass.position.set(
  0,
  -1.2,
  -180
);

scene.add(grass);

/* =========================
   ROAD LINES
========================= */

const laneLines = [];

for(let z=10; z>-450; z-=12){

  for(const x of [-2.33,2.33]){

    const line =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .12,
          .03,
          5
        ),
        whiteMat
      );

    line.position.set(
      x,
      -.8,
      z
    );

    scene.add(line);
    laneLines.push(line);
  }
}

/* =========================
   BUILDINGS
========================= */

function building(x,z){

  const h =
    5 + Math.random()*13;

  const w =
    5 + Math.random()*5;

  const material =
    new THREE.MeshStandardMaterial({
      color:new THREE.Color().setHSL(
        Math.random(),
        .35,
        .45
      )
    });

  const b =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        7
      ),
      material
    );

  b.position.set(
    x,
    h/2-1,
    z
  );

  b.castShadow = true;

  scene.add(b);

  /* windows */

  for(
    let y=2;
    y<h-1;
    y+=2.2
  ){

    const windowMat =
      new THREE.MeshStandardMaterial({
        color:0xffffaa,
        emissive:0x553300
      });

    const win =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .7,
          .8,
          .05
        ),
        windowMat
      );

    win.position.set(
      x,
      y-1,
      z-3.52
    );

    scene.add(win);
  }
}

for(
  let z=0;
  z>-430;
  z-=18
){

  building(
    -13-Math.random()*5,
    z
  );

  building(
    13+Math.random()*5,
    z-8
  );
}

/* =========================
   PALM TREES
========================= */

function palm(x,z){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .25,
        .4,
        6,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x75451e
      })
    );

  trunk.position.set(
    x,
    2,
    z
  );

  scene.add(trunk);

  const leaves =
    new THREE.Group();

  leaves.position.set(
    x,
    5,
    z
  );

  for(
    let i=0;
    i<7;
    i++
  ){

    const leaf =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .25,
          .12,
          3.8
        ),
        new THREE.MeshStandardMaterial({
          color:0x0b8f35
        })
      );

    leaf.rotation.y =
      i*Math.PI/3.5;

    leaf.rotation.x =
      -.35;

    leaves.add(leaf);
  }

  scene.add(leaves);
}

for(
  let z=0;
  z>-400;
  z-=25
){

  palm(-9,z);
  palm(9,z-10);
}

/* =========================
   PLAYER
========================= */

const player =
  new THREE.Group();

scene.add(player);

player.position.set(
  0,
  0,
  5
);

/* body */

const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .55,
      1.1,
      6,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:0x174cff
    })
  );

body.position.y=1.5;
body.castShadow=true;

player.add(body);

/* head */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .52,
      20,
      20
    ),
    new THREE.MeshStandardMaterial({
      color:0x7b482c
    })
  );

head.position.y=2.85;

head.castShadow=true;

player.add(head);

/* hair */

const hair =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .54,
      20,
      12,
      0,
      Math.PI*2,
      0,
      Math.PI/2
    ),
    new THREE.MeshStandardMaterial({
      color:0x17100b
    })
  );

hair.position.y=3.02;

player.add(hair);

/* arms */

function limb(x){

  const arm =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .15,
        .9,
        5,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x7b482c
      })
    );

  arm.position.set(
    x,
    1.55,
    0
  );

  arm.rotation.z =
    x>0 ? -.25 : .25;

  player.add(arm);

  return arm;
}

const leftArm=limb(-.7);
const rightArm=limb(.7);

/* legs */

function leg(x){

  const l =
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .18,
        1.05,
        5,
        8
      ),
      new THREE.MeshStandardMaterial({
        color:0x222222
      })
    );

  l.position.set(
    x,
    .35,
    0
  );

  player.add(l);

  return l;
}

const leftLeg=leg(-.3);
const rightLeg=leg(.3);

/* shoes */

function shoe(x){

  const s =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .42,
        .22,
        .75
      ),
      new THREE.MeshStandardMaterial({
        color:0x050505
      })
    );

  s.position.set(
    x,
    -.15,
    -.18
  );

  player.add(s);
}

shoe(-.3);
shoe(.3);

/* =========================
   PLAYER STATE
========================= */

let lane=0;

const laneWidth=3;

let velocityY=0;

let jumping=false;

let sliding=false;

let slideTimer=0;

let lives=3;

let score=0;

let coins=0;

let multiplier=1;

let speed=0.55;

let running=false;

let gameEnded=false;

let invincible=0;

let magnet=0;

let doubleScore=0;

/* =========================
   OBJECTS
========================= */

const objects=[];

function clearObjects(){

  while(objects.length){

    const obj=
      objects.pop();

    scene.remove(obj);
  }
}

/* =========================
   COIN
========================= */

function createCoin(
  laneIndex,
  z
){

  const coin =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        .42,
        .12,
        10,
        20
      ),
      new THREE.MeshStandardMaterial({
        color:0xffd700,
        emissive:0x775500,
        metalness:.8
      })
    );

  coin.position.set(
    laneIndex*laneWidth,
    1.3,
    z
  );

  coin.rotation.x=
    Math.PI/2;

  coin.userData.type="coin";

  scene.add(coin);

  objects.push(coin);
}

/* =========================
   CAR
========================= */

function createCar(
  laneIndex,
  z
){

  const car =
    new THREE.Group();

  const color =
    [0xff2222,0x0066ff,0xffffff,0xffaa00]
    [Math.floor(Math.random()*4)];

  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.3,
        .8,
        4
      ),
      new THREE.MeshStandardMaterial({
        color
      })
    );

  base.position.y=.3;

  car.add(base);

  const top =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.65,
        .65,
        2
      ),
      new THREE.MeshStandardMaterial({
        color:0x222222,
        transparent:true,
        opacity:.9
      })
    );

  top.position.y=.95;

  car.add(top);

  car.position.set(
    laneIndex*laneWidth,
    0,
    z
  );

  car.userData.type="obstacle";

  scene.add(car);

  objects.push(car);
}

/* =========================
   BUS
========================= */

function createBus(
  laneIndex,
  z
){

  const bus =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.7,
        2.7,
        6
      ),
      new THREE.MeshStandardMaterial({
        color:0x08a66a
      })
    );

  bus.position.set(
    laneIndex*laneWidth,
    .5,
    z
  );

  bus.userData.type="obstacle";

  scene.add(bus);

  objects.push(bus);
}

/* =========================
   BARRIER
========================= */

function createBarrier(
  laneIndex,
  z
){

  const barrier =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.6,
        .8,
        .7
      ),
      new THREE.MeshStandardMaterial({
        color:0xff6600
      })
    );

  barrier.position.set(
    laneIndex*laneWidth,
    -.25,
    z
  );

  barrier.userData.type="barrier";

  scene.add(barrier);

  objects.push(barrier);
}

/* =========================
   POWER UP
========================= */

function createPower(
  laneIndex,
  z
){

  const types=[
    "shield",
    "magnet",
    "double"
  ];

  const type=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  let color=0x00ffff;

  if(type==="shield")
    color=0x00aaff;

  if(type==="magnet")
    color=0xff00ff;

  if(type==="double")
    color=0xffff00;

  const p =
    new THREE.Mesh(
      new THREE.OctahedronGeometry(
        .65
      ),
      new THREE.MeshStandardMaterial({
        color,
        emissive:color,
        emissiveIntensity:.7
      })
    );

  p.position.set(
    laneIndex*laneWidth,
    1.5,
    z
  );

  p.userData.type=type;

  scene.add(p);

  objects.push(p);
}

/* =========================
   SPAWN
========================= */

let spawnTimer=0;

function spawn(){

  const laneIndex =
    Math.floor(
      Math.random()*3
    )-1;

  const z=-150;

  const r=Math.random();

  if(r<.45){

    createCar(
      laneIndex,
      z
    );

  }else if(r<.7){

    createBus(
      laneIndex,
      z
    );

  }else{

    createBarrier(
      laneIndex,
      z
    );
  }

  /* coins */

  if(Math.random()<.75){

    for(
      let i=0;
      i<5;
      i++
    ){

      createCoin(
        laneIndex,
        z-5-i*4
      );
    }
  }

  /* power */

  if(Math.random()<.15){

    createPower(
      laneIndex,
      z-18
    );
  }
}

/* =========================
   MOVEMENT
========================= */

function moveLeft(){

  lane--;

  if(lane<-1)
    lane=-1;
}

function moveRight(){

  lane++;

  if(lane>1)
    lane=1;
}

function jump(){

  if(!jumping && !sliding){

    jumping=true;

    velocityY=.25;
  }
}

function slide(){

  if(!jumping){

    sliding=true;

    slideTimer=.55;
  }
}

/* =========================
   CONTROLS
========================= */

leftBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    moveLeft();
  }
);

rightBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    moveRight();
  }
);

jumpBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    jump();
  }
);

slideBtn.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    slide();
  }
);

/* keyboard */

window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      moveLeft();

    if(e.key==="ArrowRight")
      moveRight();

    if(e.key==="ArrowUp" ||
       e.key===" ")
      jump();

    if(e.key==="ArrowDown")
      slide();
  }
);

/* swipe */

let touchX=0;
let touchY=0;

window.addEventListener(
  "touchstart",
  e=>{

    touchX=e.touches[0].clientX;
    touchY=e.touches[0].clientY;
  },
  {passive:true}
);

window.addEventListener(
  "touchend",
  e=>{

    const x=
      e.changedTouches[0].clientX;

    const y=
      e.changedTouches[0].clientY;

    const dx=x-touchX;
    const dy=y-touchY;

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>40)
        moveRight();

      if(dx<-40)
        moveLeft();

    }else{

      if(dy<-40)
        jump();

      if(dy>40)
        slide();
    }
  },
  {passive:true}
);

/* =========================
   COLLISION
========================= */

function hit(a,b){

  const dx=
    Math.abs(a.position.x-b.position.x);

  const dz=
    Math.abs(a.position.z-b.position.z);

  return (
    dx<1.45 &&
    dz<2
  );
}

/* =========================
   POWER EFFECT
========================= */

function collectPower(type){

  if(type==="shield")
    invincible=10;

  if(type==="magnet")
    magnet=10;

  if(type==="double")
    doubleScore=10;
}

/* =========================
   RESET
========================= */

function reset(){

  clearObjects();

  lane=0;

  player.position.x=0;
  player.position.y=0;

  velocityY=0;

  jumping=false;
  sliding=false;

  lives=3;
  score=0;
  coins=0;

  multiplier=1;

  speed=.55;

  invincible=0;
  magnet=0;
  doubleScore=0;

  spawnTimer=0;

  gameEnded=false;

  gameover.style.display="none";

  updateHUD();
}

/* =========================
   GAME OVER
========================= */

function endGame(){

  running=false;

  gameEnded=true;

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(score);

  document.getElementById(
    "finalCoins"
  ).textContent=
    coins;

  gameover.style.display="block";
}

/* =========================
   HUD
========================= */

function updateHUD(){

  scoreEl.textContent=
    Math.floor(score);

  coinsEl.textContent=
    coins;

  livesEl.textContent=
    lives;

  speedEl.textContent=
    speed.toFixed(1);
}

/* =========================
   GAME LOOP
========================= */

let lastTime=0;

function animate(time){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      (time-lastTime)/1000,
      .05
    );

  lastTime=time;

  /* player lane */

  const targetX=
    lane*laneWidth;

  player.position.x +=
    (targetX-player.position.x)
    *Math.min(1,dt*12);

  /* jump */

  if(jumping){

    player.position.y +=
      velocityY;

    velocityY -=
      .012;

    if(
      player.position.y<=0
    ){

      player.position.y=0;

      velocityY=0;

      jumping=false;
    }
  }

  /* slide */

  if(sliding){

    slideTimer-=dt;

    player.scale.y=.55;

    if(slideTimer<=0){

      sliding=false;

      player.scale.y=1;
    }
  }

  /* running animation */

  if(running){

    const t=
      performance.now()*.012;

    leftLeg.rotation.x=
      Math.sin(t)*.8;

    rightLeg.rotation.x=
      -Math.sin(t)*.8;

    leftArm.rotation.x=
      -Math.sin(t)*.7;

    rightArm.rotation.x=
      Math.sin(t)*.7;
  }

  /* world */

  if(running){

    spawnTimer-=dt;

    if(spawnTimer<=0){

      spawn();

      spawnTimer=
        .65+
        Math.random()*.7;
    }

    /* speed increase */

    speed +=
      dt*.006;

    if(speed>1.45)
      speed=1.45;

    /* objects */

    for(
      let i=objects.length-1;
      i>=0;
      i--
    ){

      const obj=
        objects[i];

      obj.position.z +=
        speed*60*dt;

      obj.rotation.y +=
        dt*2;

      /* coin magnet */

      if(
        magnet>0 &&
        obj.userData.type==="coin"
      ){

        const dx=
          player.position.x-
          obj.position.x;

        const dy=
          1.2-
          obj.position.y;

        const dz=
          player.position.z-
          obj.position.z;

        const dist=
          Math.sqrt(
            dx*dx+
            dy*dy+
            dz*dz
          );

        if(dist<12){

          obj.position.x +=
            dx*dt*5;

          obj.position.y +=
            dy*dt*5;

          obj.position.z +=
            dz*dt*5;
        }
      }

      /* collision */

      if(
        hit(player,obj)
      ){

        const type=
          obj.userData.type;

        if(type==="coin"){

          coins++;

          score+=
            100*multiplier;

          scene.remove(obj);

          objects.splice(i,1);

          continue;
        }

        if(
          type==="shield" ||
          type==="magnet" ||
          type==="double"
        ){

          collectPower(type);

          scene.remove(obj);

          objects.splice(i,1);

          continue;
        }

        if(
          type==="obstacle" ||
          type==="barrier"
        ){

          if(
            invincible<=0 &&
            !jumping &&
            !sliding
          ){

            lives--;

            multiplier=1;

            invincible=2;

            scene.remove(obj);

            objects.splice(i,1);

            if(lives<=0){

              endGame();
            }

            continue;
          }
        }
      }

      /* remove old */

      if(obj.position.z>20){

        scene.remove(obj);

        objects.splice(i,1);
      }
    }

    /* power timers */

    if(invincible>0)
      invincible-=dt;

    if(magnet>0)
      magnet-=dt;

    if(doubleScore>0)
      doubleScore-=dt;

    /* score */

    let scoreGain=
      speed*dt*10;

    if(doubleScore>0)
      scoreGain*=2;

    score+=scoreGain;
  }

  /* camera */

  camera.position.x +=
    (player.position.x*.25-
     camera.position.x)
    *dt*4;

  camera.position.y=
    5.1+
    player.position.y*.25;

  camera.lookAt(
    player.position.x,
    1.4,
    -20
  );

  updateHUD();

  renderer.render(
    scene,
    camera
  );
}

/* =========================
   START
========================= */

startBtn.addEventListener(
  "click",
  ()=>{

    reset();

    message.style.display="none";

    running=true;
  }
);

restartBtn.addEventListener(
  "click",
  ()=>{

    reset();

    running=true;
  }
);

/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* START RENDER */

updateHUD();

animate(0);

</script>

</html>
