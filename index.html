<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neo Run: Naija</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030712;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100%;
  height:100%;
  display:block;
}

#ui{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  z-index:5;
  color:white;
  font-weight:bold;
  font-size:16px;
  pointer-events:none;
}

.badge{
  background:rgba(0,0,0,.55);
  border:1px solid #20c76b;
  padding:9px 12px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(32,199,107,.35);
}

#message{
  position:fixed;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.72);
}

#message h1{
  font-size:clamp(45px,13vw,75px);
  color:#20c76b;
  letter-spacing:4px;
  text-shadow:
    0 0 8px #20c76b,
    0 0 25px #20c76b;
}

#message p{
  margin:5px;
  color:#d7e7e0;
  font-size:15px;
}

#message .subtitle{
  color:#ffd83d;
  font-size:18px;
  margin:5px 0 15px;
}

button{
  margin-top:20px;
  padding:15px 32px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#20c76b,#087b42);
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 25px rgba(32,199,107,.5);
}

.hidden{
  display:none!important;
}

#hint{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.65);
  font-size:11px;
  z-index:4;
  white-space:nowrap;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  <div class="badge">🇳🇬 NEO RUN</div>

  <div class="badge">
    ₦ <span id="coins">0</span>
    &nbsp; SCORE <span id="score">0</span>
  </div>
</div>

<div id="hint">
  SWIPE ← → TO MOVE • SWIPE ↑ TO JUMP
</div>

<div id="message">

  <h1>NEO RUN</h1>

  <div class="subtitle">
    🇳🇬 NAIJA DIGITAL RUNNER
  </div>

  <p>Swipe left / right to move</p>
  <p>Swipe up to jump</p>

  <button id="startBtn">
    START RUN
  </button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const coinText = document.getElementById("coins");
const message = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

let W = 0;
let H = 0;
let running = false;

let score = 0;
let coinsCollected = 0;

let speed = 6;
let spawnTimer = 0;
let lastTime = 0;
let roadOffset = 0;

const obstacles = [];
const coins = [];
const particles = [];
const stars = [];

const player = {
  lane:1,
  x:0,
  y:0,
  jump:0,
  jumping:false,
  animation:0
};


/* =========================
   RESIZE
========================= */

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;

  player.y = H - 145;
  player.x = laneX(player.lane);

  stars.length = 0;

  for(let i=0;i<60;i++){

    stars.push({
      x:Math.random()*W,
      y:Math.random()*H*.55,
      size:Math.random()*2+0.5
    });

  }

}

window.addEventListener("resize",resize);

resize();


/* =========================
   ROAD LANES
========================= */

function laneX(lane){

  const left = W * .12;
  const width = W * .76;

  return left + width * (lane + .5) / 3;

}

========================= */

  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);


  /* STARS */

  for(const star of stars){

    ctx.globalAlpha =
      .4 + Math.sin(time*.002 + star.x)*.3;

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

    W*.78,

  );

  sun.addColorStop(
    1,
    "rgba(255,170,50,0)"
  );

  ctx.fillStyle = sun;

  ctx.beginPath();

  ctx.arc(

    H*.18,

    ctx.fillStyle =
      i%2
      ? "#173247"

    ctx.fillRect(

    );
