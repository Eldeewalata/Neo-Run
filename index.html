<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neo Run: Naija 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#78cfff}
body{font-family:Arial,sans-serif;touch-action:none}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.hudBox{
  color:white;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;
  padding:9px 14px;
  font-size:18px;
  font-weight:bold;
  text-shadow:2px 2px 4px #000;
}

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
  background:linear-gradient(
    rgba(0,30,60,.15),
    rgba(0,0,0,.62)
  );
}

#menu h1{
  font-size:clamp(38px,11vw,72px);
  letter-spacing:2px;
  text-shadow:0 6px 20px #000;
}

#menu p{
  margin:10px 0 28px;
  font-size:18px;
  text-shadow:2px 2px 5px #000;
}

#startBtn{
  border:0;
  border-radius:18px;
  padding:17px 42px;
  font-size:22px;
  font-weight:bold;
  color:white;
  background:#087ed1;
  box-shadow:0 7px 25px rgba(0,0,0,.45);
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  z-index:12;
  display:flex;
  justify-content:center;
  gap:18px;
}

.control{
  width:76px;
  height:60px;
  border:0;
  border-radius:18px;
  color:white;
  background:rgba(0,0,0,.48);
  font-size:30px;
  font-weight:bold;
  box-shadow:0 5px 18px rgba(0,0,0,.4);
}

#gameOver{
  display:none;
  position:fixed;
  inset:0;
  z-index:30;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
  background:rgba(0,0,0,.55);
}

#gameOver h2{
  font-size:48px;
  text-shadow:0 5px 15px #000;
}

#gameOver p{
  font-size:22px;
  margin:12px;
}

#restart{
  border:0;
  border-radius:16px;
  padding:15px 35px;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div class="hudBox" id="score">SCORE: 0</div>
  <div class="hudBox" id="coins">🪙 0</div>
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
</div>

<div id="menu">
  <h1>NEO RUN</h1>
  <p>NAIJA • REAL 3D RUNNER</p>
  <button id="startBtn">START RUN</button>
</div>

<div id="gameOver">
  <h2>GAME OVER</h2>
  <p id="finalScore">Score: 0</p>
  <button id="restart">RUN AGAIN</button>
</div>

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.186.1/+esm";

/* =========================
   BASIC THREE.JS SETUP
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x79cfff);

scene.fog = new THREE.Fog(
  0x79cfff,
  35,
  145
);

const camera = new THREE.PerspectiveCamera(
  62,
  innerWidth / innerHeight,
  0.1,
  300
);

camera.position.set(
  0,
  5.3,
  10
);

camera.lookAt(
  0,
  1.8,
  -20
);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputColorSpace=THREE.SRGBColorSpace;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =========================
   LIGHTING
========================= */

const hemi = new THREE.HemisphereLight(
  0xbde9ff,
  0x315c2e,
  2.3
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  -30,
  45,
  25
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-50;
sun.shadow.camera.right=50;
sun.shadow.camera.top=50;
sun.shadow.camera.bottom=-50;

scene.add(sun);


/* =========================
   SKY SUN
========================= */

const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(6,32,32),
  new THREE.MeshBasicMaterial({
    color:0xfff1a3
  })
);

sunMesh.position.set(
  45,
  35,
  -90
);

scene.add(sunMesh);


/* =========================
   MATERIALS
========================= */

const roadMat =
  new THREE.MeshStandardMaterial({
    color:0x25272b,
    roughness:.9
  });

const grassMat =
  new THREE.MeshStandardMaterial({
    color:0x26752e,
    roughness:1
  });

const whiteMat =
  new THREE.MeshStandardMaterial({
    color:0xffffff,
    roughness:.7
  });

const yellowMat =
  new THREE.MeshStandardMaterial({
    color:0xffd21c,
    metalness:.65,
    roughness:.25
  });


/* =========================
   ROAD
========================= */

const road = new THREE.Mesh(
  new THREE.BoxGeometry(
    12,
    .25,
    240
  ),
  roadMat
);

road.position.set(
  0,
  0,
  -75
);

road.receiveShadow=true;

scene.add(road);


/* GRASS */

const grassLeft = new THREE.Mesh(
  new THREE.BoxGeometry(
    70,
    .2,
    240
  ),
  grassMat
);

grassLeft.position.set(
  -41,
  -.12,
  -75
);

scene.add(grassLeft);

const grassRight = grassLeft.clone();

grassRight.position.x=41;

scene.add(grassRight);


/* =========================
   ROAD LANE MARKINGS
========================= */

const laneMarkers=[];

for(let z=0;z>-230;z-=10){

  for(const x of [-2,2]){

    const marker=new THREE.Mesh(
      new THREE.BoxGeometry(
        .12,
        .03,
        4
      ),
      whiteMat
    );

    marker.position.set(
      x,
      .16,
      z
    );

    scene.add(marker);
    laneMarkers.push(marker);
  }
}


/* =========================
   BUILDINGS
========================= */

function makeBuilding(x,z){

  const h =
    5 +
    Math.random()*13;

  const w =
    4 +
    Math.random()*5;

  const d =
    4 +
    Math.random()*5;

  const colors=[
    0x777777,
    0x8b7355,
    0x516778,
    0x9c7956,
    0x58616a
  ];

  const building=new THREE.Mesh(
    new THREE.BoxGeometry(
      w,h,d
    ),
    new THREE.MeshStandardMaterial({
      color:
        colors[
          Math.floor(
            Math.random()*colors.length
          )
        ]
    })
  );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);

  /* WINDOWS */

  for(
    let y=2;
    y<h-1;
    y+=2.4
  ){

    const windows=new THREE.Mesh(
      new THREE.BoxGeometry(
        w*.72,
        .35,
        .05
      ),
      new THREE.MeshBasicMaterial({
        color:0xffdf65
      })
    );

    windows.position.set(
      x,
      y,
      z-d/2-.03
    );

    scene.add(windows);
  }
}

for(let z=-15;z>-230;z-=14){

  makeBuilding(
    -12-Math.random()*10,
    z
  );

  makeBuilding(
    12+Math.random()*10,
    z-6
  );
}


/* =========================
   PALM TREES
========================= */

function makePalm(x,z){

  const group=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .28,
      .42,
      5,
      10
    ),
    new THREE.MeshStandardMaterial({
      color:0x70431f
    })
  );

  trunk.position.y=2.5;

  trunk.castShadow=true;

  group.add(trunk);

  for(let i=0;i<7;i++){

    const leaf=new THREE.Mesh(
      new THREE.BoxGeometry(
        .22,
        .08,
        3.5
      ),
      new THREE.MeshStandardMaterial({
        color:0x198c37
      })
    );

    leaf.position.y=5.2;

    leaf.rotation.y=
      i*Math.PI*2/7;

    leaf.rotation.x=.2;

    group.add(leaf);
  }

  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);
}

for(let z=-15;z>-220;z-=22){

  makePalm(
    -8.5-Math.random()*2,
    z
  );

  makePalm(
    8.5+Math.random()*2,
    z-9
  );
}


/* =========================
   PLAYER
========================= */

function makePlayer(){

  const p=new THREE.Group();

  /* body */

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(
      1,
      1.5,
      .65
    ),
    new THREE.MeshStandardMaterial({
      color:0x087fd1
    })
  );

  body.position.y=1.65;
  body.castShadow=true;

  p.add(body);

  /* head */

  const head=new THREE.Mesh(
    new THREE.SphereGeometry(
      .48,
      24,
      24
    ),
    new THREE.MeshStandardMaterial({
      color:0x754126
    })
  );

  head.position.y=2.75;
  head.castShadow=true;

  p.add(head);

  /* hair */

  const hair=new THREE.Mesh(
    new THREE.SphereGeometry(
      .49,
      20,
      12,
      0,
      Math.PI*2,
      0,
      Math.PI*.42
    ),
    new THREE.MeshStandardMaterial({
      color:0x151515
    })
  );

  hair.position.y=2.92;

  p.add(hair);

  /* legs */

  const legMat=
    new THREE.MeshStandardMaterial({
      color:0x20252a
    });

  const leftLeg=new THREE.Mesh(
    new THREE.BoxGeometry(
      .28,
      1.25,
      .32
    ),
    legMat
  );

  const rightLeg=leftLeg.clone();

  leftLeg.position.set(
    -.25,
    .55,
    0
  );

  rightLeg.position.set(
    .25,
    .55,
    0
  );

  leftLeg.castShadow=true;
  rightLeg.castShadow=true;

  p.add(
    leftLeg,
    rightLeg
  );

  /* arms */

  const armMat=
    new THREE.MeshStandardMaterial({
      color:0x754126
    });

  const leftArm=new THREE.Mesh(
    new THREE.BoxGeometry(
      .25,
      1.05,
      .28
    ),
    armMat
  );

  const rightArm=leftArm.clone();

  leftArm.position.set(
    -.72,
    1.65,
    0
  );

  rightArm.position.set(
    .72,
    1.65,
    0
  );

  p.add(
    leftArm,
    rightArm
  );

  return p;
}

const player=makePlayer();

player.position.set(
  0,
  0,
  5
);

scene.add(player);


/* =========================
   GAME VARIABLES
========================= */

const laneX=[
  -4,
  0,
  4
];

let currentLane=1;

let speed=.45;

let score=0;
let coinCount=0;

let playing=false;

let objects=[];

let spawnClock=0;
let coinClock=0;

const clock=new THREE.Clock();


/* =========================
   OBSTACLE
========================= */

function createObstacle(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  const group=new THREE.Group();

  const base=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.2,
      1.6,
      2
    ),
    new THREE.MeshStandardMaterial({
      color:0xd68b16,
      roughness:.65
    })
  );

  base.position.y=.8;

  base.castShadow=true;
  base.receiveShadow=true;

  group.add(base);

  /* warning stripe */

  const stripe=new THREE.Mesh(
    new THREE.BoxGeometry(
      2.25,
      .28,
      2.05
    ),
    new THREE.MeshStandardMaterial({
      color:0x171717
    })
  );

  stripe.position.y=1.25;

  group.add(stripe);

  group.position.set(
    laneX[lane],
    0,
    -105
  );

  scene.add(group);

  objects.push({
    mesh:group,
    type:"obstacle",
    lane,
    z:-105
  });
}


/* =========================
   COIN
========================= */

function createCoin(){

  const lane=
    Math.floor(
      Math.random()*3
    );

  const coin=new THREE.Mesh(
    new THREE.CylinderGeometry(
      .55,
      .55,
      .16,
      32
    ),
    yellowMat
  );

  coin.rotation.x=
    Math.PI/2;

  coin.position.set(
    laneX[lane],
    1.7,
    -105
  );

  coin.castShadow=true;

  scene.add(coin);

  objects.push({
    mesh:coin,
    type:"coin",
    lane,
    z:-105
  });
}


/* =========================
   INPUT
========================= */

function left(){

  if(!playing)return;

  currentLane=
    Math.max(
      0,
      currentLane-1
    );
}

function right(){

  if(!playing)return;

  currentLane=
    Math.min(
      2,
      currentLane+1
    );
}

document
  .getElementById("left")
  .addEventListener(
    "pointerdown",
    left
  );

document
  .getElementById("right")
  .addEventListener(
    "pointerdown",
    right
  );

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      left();

    if(e.key==="ArrowRight")
      right();
  }
);


/* =========================
   SWIPE
========================= */

let touchX=0;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{
    touchX=e.touches[0].clientX;
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchend",
  e=>{

    const x=
      e.changedTouches[0].clientX;

    const dx=x-touchX;

    if(Math.abs(dx)>45){

      if(dx>0)right();
      else left();
    }
  },
  {passive:true}
);


/* =========================
   SIMPLE INSTRUMENTAL
========================= */

let audio;
let musicInterval;

function music(){

  if(audio)return;

  audio=
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  const notes=[
    261.63,
    329.63,
    392,
    329.63,
    293.66,
    349.23,
    440,
    349.23
  ];

  let i=0;

  musicInterval=setInterval(()=>{

    if(!playing)return;

    const osc=
      audio.createOscillator();

    const gain=
      audio.createGain();

    osc.type="triangle";

    osc.frequency.value=
      notes[i%notes.length];

    gain.gain.setValueAtTime(
      .0001,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .035,
      audio.currentTime+.04
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audio.currentTime+.32
    );

    osc.connect(gain);
    gain.connect(audio.destination);

    osc.start();

    osc.stop(
      audio.currentTime+.35
    );

    i++;

  },360);
}


/* =========================
   START
========================= */

function startGame(){

  document
    .getElementById("menu")
    .style.display="none";

  document
    .getElementById("gameOver")
    .style.display="none";

  playing=true;

  score=0;
  coinCount=0;
  speed=.45;
  currentLane=1;

  document
    .getElementById("score")
    .textContent="SCORE: 0";

  document
    .getElementById("coins")
    .textContent="🪙 0";

  objects.forEach(o=>{
    scene.remove(o.mesh);
  });

  objects=[];

  music();
}

document
  .getElementById("startBtn")
  .onclick=startGame;

document
  .getElementById("restart")
  .onclick=startGame;


/* =========================
   GAME OVER
========================= */

function endGame(){

  playing=false;

  document
    .getElementById("finalScore")
    .textContent=
      "Score: "+Math.floor(score);

  document
    .getElementById("gameOver")
    .style.display="flex";
}


/* =========================
   COLLISION
========================= */

function checkCollision(o){

  if(
    Math.abs(
      o.mesh.position.z-
      player.position.z
    )<1.7 &&
    Math.abs(
      o.mesh.position.x-
      player.position.x
    )<1.35
  ){

    if(o.type==="coin"){

      coinCount++;

      document
        .getElementById("coins")
        .textContent=
          "🪙 "+coinCount;

      scene.remove(o.mesh);

      return true;
    }

    if(o.type==="obstacle"){

      endGame();

      return true;
    }
  }

  return false;
}


/* =========================
   ANIMATION
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const delta=
    Math.min(
      clock.getDelta(),
      .05
    );

  /* player lane movement */

  const targetX=
    laneX[currentLane];

  player.position.x +=
    (
      targetX-
      player.position.x
    ) *
    Math.min(
      1,
      delta*12
    );

  /* running animation */

  if(playing){

    const t=
      performance.now()*.012;

    player.rotation.z=
      Math.sin(t)*.025;

    player.position.y=
      Math.abs(
        Math.sin(t)
      )*.05;
  }

  /* camera follows */

  camera.position.x +=
    (
      player.position.x*.12-
      camera.position.x
    )*.08;

  camera.lookAt(
    player.position.x*.15,
    1.8,
    -28
  );

  /* move objects */

  if(playing){

    spawnClock+=delta;
    coinClock+=delta;

    if(
      spawnClock>
      Math.max(
        .55,
        1.25-speed
      )
    ){

      createObstacle();

      spawnClock=0;
    }

    if(
      coinClock>
      .72
    ){

      createCoin();

      coinClock=0;
    }

    speed+=
      delta*.008;

    score+=
      delta*10;

    document
      .getElementById("score")
      .textContent=
        "SCORE: "+
        Math.floor(score);
  }

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const o=objects[i];

    if(playing){

      o.mesh.position.z +=
        speed*
        35*
        delta;

      o.mesh.rotation.y +=
        delta*4;
    }

    if(checkCollision(o)){

      objects.splice(i,1);

      continue;
    }

    if(
      o.mesh.position.z>
      15
    ){

      scene.remove(o.mesh);

      objects.splice(i,1);
    }
  }

  /* lane markers move */

  laneMarkers.forEach(m=>{

    if(playing){

      m.position.z +=
        speed*35*delta;

      if(
        m.position.z>10
      ){
        m.position.z-=240;
      }
    }
  });

  renderer.render(
    scene,
    camera
  );
}

animate();


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
</html>
