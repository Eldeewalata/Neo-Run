<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>NEO RUN: NAIJA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020604;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:900px;
    overflow:hidden;
    background:#06100d;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* HUD */

#hud{
    position:absolute;
    top:15px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.hudBox{
    padding:10px 14px;
    border:1px solid rgba(0,255,120,.35);
    border-radius:15px;
    background:rgba(0,10,7,.78);
    backdrop-filter:blur(8px);
    color:white;
    font-weight:bold;
    font-size:14px;
    box-shadow:0 0 18px rgba(0,255,100,.12);
}

.green{
    color:#29e879;
}

.gold{
    color:#ffd84a;
}

/* START / GAME OVER */

.overlay{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
    radial-gradient(
        circle at center,
        rgba(0,100,50,.35),
        rgba(0,0,0,.95) 68%
    );
}

.panel{
    width:92%;
    max-width:500px;
    padding:20px;
}

.flag{
    font-size:38px;
}

.title{
    margin-top:4px;
    font-size:clamp(48px,14vw,82px);
    font-weight:900;
    letter-spacing:4px;
    color:#27e879;
    text-shadow:
    0 0 10px rgba(39,232,121,.5),
    0 0 35px rgba(39,232,121,.25);
}

.subtitle{
    color:#e4bd32;
    font-size:clamp(16px,4.5vw,25px);
    letter-spacing:2px;
}

.description{
    margin-top:18px;
    color:#d9e1dc;
    line-height:1.6;
    font-size:15px;
}

/* LEVELS */

.levelTitle{
    margin-top:20px;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1px;
}

.levels{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:10px;
}

.level{
    flex:1;
    max-width:120px;
    padding:12px 5px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:13px;
    background:rgba(255,255,255,.06);
    color:#ddd;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.level small{
    display:block;
    margin-top:4px;
    color:#9ba59f;
    font-weight:normal;
    font-size:10px;
}

.level.selected{
    border-color:#27e879;
    background:rgba(0,160,70,.25);
    color:#27e879;
    box-shadow:0 0 15px rgba(0,255,100,.16);
}

.level.hard.selected{
    border-color:#ff4b4b;
    color:#ff6969;
    background:rgba(180,0,0,.2);
}

/* BUTTON */

.startButton{
    margin-top:20px;
    width:100%;
    max-width:330px;
    padding:17px 25px;
    border:0;
    border-radius:17px;
    background:linear-gradient(135deg,#00a83b,#006f27);
    color:white;
    font-size:19px;
    font-weight:900;
    letter-spacing:1px;
    box-shadow:
    0 0 18px rgba(0,255,100,.3),
    0 8px 25px rgba(0,0,0,.5);
    cursor:pointer;
}

.startButton:active{
    transform:scale(.96);
}

.instructions{
    margin-top:15px;
    color:#8e9993;
    font-size:12px;
}

/* SOUND */

#soundButton{
    position:absolute;
    top:72px;
    right:14px;
    z-index:12;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.55);
    color:white;
    font-size:20px;
    cursor:pointer;
}

/* GAME OVER */

#gameOver{
    display:none;
}

.finalScore{
    font-size:48px;
    font-weight:bold;
    color:#27e879;
    margin:15px 0;
}

.finalText{
    color:#ddd;
    font-size:15px;
    line-height:1.8;
}

/* CONTROLS */

#controls{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    display:none;
    justify-content:space-between;
    padding:0 18px;
    z-index:15;
    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:10px;
}

.control{
    width:56px;
    height:56px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.55);
    color:white;
    font-size:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;
    user-select:none;
}

.control:active{
    background:rgba(0,180,70,.7);
}

@media(max-width:600px){

    #controls{
        display:flex;
    }

    .hudBox{
        font-size:12px;
        padding:8px 10px;
    }

}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

    <div class="hudBox">
        🇳🇬 <span class="green">NEO RUN</span>
        <span id="levelDisplay"></span>
    </div>

    <div class="hudBox">
        ₦ <span id="money" class="gold">0</span>
        &nbsp; SCORE <span id="score" class="green">0</span>
    </div>

</div>

<button id="soundButton">🔊</button>


<!-- START SCREEN -->

<div id="startScreen" class="overlay">

<div class="panel">

    <div class="flag">🇳🇬</div>

    <div class="title">NEO RUN</div>

    <div class="subtitle">
        NAIJA DIGITAL RUNNER
    </div>

    <div class="description">
        Run through the streets of Nigeria.<br>
        Dodge Danfos and Kekes.<br>
        Collect Naira and beat your high score.
    </div>

    <div class="levelTitle">
        SELECT DIFFICULTY
    </div>

    <div class="levels">

        <button class="level" data-level="easy">
            EASY
            <small>Slow traffic</small>
        </button>

        <button class="level selected" data-level="normal">
            NORMAL
            <small>Balanced</small>
        </button>

        <button class="level hard" data-level="hard">
            HARD
            <small>Fast traffic</small>
        </button>

    </div>

    <button id="startButton" class="startButton">
        START RUN
    </button>

    <div class="instructions">
        SWIPE ← → TO MOVE &nbsp; • &nbsp; SWIPE ↑ TO JUMP
    </div>

</div>

</div>


<!-- GAME OVER -->

<div id="gameOver" class="overlay">

<div class="panel">

    <div class="flag">🇳🇬</div>

    <div class="title" style="font-size:45px">
        GAME OVER
    </div>

    <div class="finalScore">
        <span id="finalScore">0</span>
    </div>

    <div class="finalText">
        Naira collected: ₦<span id="finalMoney">0</span><br>
        Difficulty: <span id="finalLevel">NORMAL</span>
    </div>

    <button id="restartButton" class="startButton">
        RUN AGAIN
    </button>

</div>

</div>


<!-- MOBILE CONTROLS -->

<div id="controls">

    <div class="controlGroup">

        <div class="control" id="leftBtn">
            ←
        </div>

        <div class="control" id="rightBtn">
            →
        </div>

    </div>

    <div class="controlGroup">

        <div class="control" id="jumpBtn">
            ↑
        </div>

    </div>

</div>


<script>

/* =========================================================
   NEO RUN: NAIJA
   Difficulty + Sound Edition
========================================================= */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


/* UI */

const startScreen =
document.getElementById("startScreen");

const gameOverScreen =
document.getElementById("gameOver");

const startButton =
document.getElementById("startButton");

const restartButton =
document.getElementById("restartButton");

const scoreEl =
document.getElementById("score");

const moneyEl =
document.getElementById("money");

const finalScoreEl =
document.getElementById("finalScore");

const finalMoneyEl =
document.getElementById("finalMoney");

const finalLevelEl =
document.getElementById("finalLevel");

const levelDisplay =
document.getElementById("levelDisplay");

const soundButton =
document.getElementById("soundButton");


/* =========================================================
   CANVAS
========================================================= */

let W = 0;
let H = 0;
let DPR = 1;

function resize(){

    DPR =
    Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width =
    W * DPR;

    canvas.height =
    H * DPR;

    canvas.style.width =
    W + "px";

    canvas.style.height =
    H + "px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   DIFFICULTIES
========================================================= */

const levels = {

    easy:{
        name:"EASY",
        startSpeed:4.0,
        maxSpeed:6.2,
        obstacleGap:105,
        coinGap:72
    },

    normal:{
        name:"NORMAL",
        startSpeed:5.0,
        maxSpeed:8.0,
        obstacleGap:90,
        coinGap:65
    },

    hard:{
        name:"HARD",
        startSpeed:6.0,
        maxSpeed:10.5,
        obstacleGap:65,
        coinGap:52
    }

};

let selectedLevel =
"normal";

let settings =
levels[selectedLevel];


/* =========================================================
   GAME STATE
========================================================= */

let running = false;

let score = 0;
let money = 0;

let speed = 5;

let lastTime = 0;

let roadOffset = 0;
let buildingOffset = 0;

let obstacleTimer = 0;
let coinTimer = 0;

let obstacles = [];
let coins = [];
let particles = [];


/* =========================================================
   LEVEL BUTTONS
========================================================= */

document.querySelectorAll(".level")
.forEach(button=>{

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".level")
            .forEach(b=>
                b.classList.remove("selected")
            );

            this.classList.add("selected");

            selectedLevel =
            this.dataset.level;

            settings =
            levels[selectedLevel];

            levelDisplay.textContent =
            " • " + settings.name;

        }
    );

});


/* =========================================================
   PLAYER
========================================================= */

const player = {

    lane:1,

    x:0,
    targetX:0,

    y:0,
    groundY:0,

    vy:0,

    jumping:false,

    bob:0

};


/* =========================================================
   AUDIO SYSTEM
========================================================= */

let audioCtx = null;

let soundEnabled = true;

let engineOsc = null;
let engineGain = null;


/* Start audio */

function initAudio(){

    if(!audioCtx){

        audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

}


/* Generic sound */

function beep(
    frequency,
    duration,
    type="sine",
    volume=.08
){

    if(!soundEnabled) return;

    initAudio();

    const osc =
    audioCtx.createOscillator();

    const gain =
    audioCtx.createGain();

    osc.type = type;

    osc.frequency.value =
    frequency;

    gain.gain.setValueAtTime(
        volume,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime + duration
    );
}


/* Start sound */

function startSound(){

    beep(260,.12,"square",.07);

    setTimeout(
        ()=>beep(420,.16,"square",.08),
        100
    );

    setTimeout(
        ()=>beep(620,.25,"square",.06),
        220
    );

}


/* Coin */

function coinSound(){

    beep(850,.08,"sine",.08);

    setTimeout(
        ()=>beep(1250,.12,"sine",.06),
        60
    );

}


/* Jump */

function jumpSound(){

    beep(320,.12,"triangle",.06);

    setTimeout(
        ()=>beep(520,.14,"triangle",.04),
        70
    );

}


/* Crash */

function crashSound(){

    beep(90,.4,"sawtooth",.13);

    setTimeout(
        ()=>beep(55,.5,"square",.09),
        100
    );

}


/* Engine ambience */

function startEngine(){

    if(!soundEnabled) return;

    initAudio();

    if(engineOsc) return;

    engineOsc =
    audioCtx.createOscillator();

    engineGain =
    audioCtx.createGain();

    engineOsc.type =
    "sawtooth";

    engineOsc.frequency.value =
    55;

    engineGain.gain.value =
    .018;

    engineOsc.connect(engineGain);

    engineGain.connect(
        audioCtx.destination
    );

    engineOsc.start();

}


function stopEngine(){

    if(engineOsc){

        try{
            engineOsc.stop();
        }catch(e){}

        engineOsc = null;
        engineGain = null;

    }

}


/* Sound button */

soundButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        soundEnabled =
        !soundEnabled;

        this.textContent =
        soundEnabled ? "🔊" : "🔇";

        if(!soundEnabled){

            stopEngine();

        }else if(running){

            startEngine();

        }

    }
);


/* =========================================================
   ROAD
========================================================= */

function roadLeft(){

    return W*.18;

}

function roadRight(){

    return W*.82;

}

function laneWidth(){

    return (
        roadRight()-roadLeft()
    )/3;

}

function laneX(lane){

    return (
        roadLeft()+
        laneWidth()*lane+
        laneWidth()/2
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    initAudio();

    settings =
    levels[selectedLevel];

    running = true;

    score = 0;
    money = 0;

    speed =
    settings.startSpeed;

    roadOffset = 0;
    buildingOffset = 0;

    obstacleTimer = 0;
    coinTimer = 0;

    obstacles = [];
    coins = [];
    particles = [];

    player.lane = 1;

    player.x =
    laneX(1);

    player.targetX =
    player.x;

    player.groundY =
    H-130;

    player.y =
    player.groundY;

    player.vy = 0;
    player.jumping = false;

    scoreEl.textContent = "0";
    moneyEl.textContent = "0";

    levelDisplay.textContent =
    " • " + settings.name;

    startScreen.style.display =
    "none";

    gameOverScreen.style.display =
    "none";

    startSound();

    setTimeout(
        startEngine,
        350
    );

    lastTime =
    performance.now();

    requestAnimationFrame(loop);

}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(!running) return;

    running = false;

    stopEngine();

    crashSound();

    finalScoreEl.textContent =
    Math.floor(score);

    finalMoneyEl.textContent =
    money;

    finalLevelEl.textContent =
    settings.name;

    gameOverScreen.style.display =
    "flex";

}


/* =========================================================
   MOVEMENT
========================================================= */

function moveLeft(){

    if(!running) return;

    if(player.lane > 0){

        player.lane--;

        player.targetX =
        laneX(player.lane);

        beep(180,.06,"square",.025);

    }

}


function moveRight(){

    if(!running) return;

    if(player.lane < 2){

        player.lane++;

        player.targetX =
        laneX(player.lane);

        beep(220,.06,"square",.025);

    }

}


function jump(){

    if(!running) return;

    if(!player.jumping){

        player.jumping = true;

        player.vy = -17;

        jumpSound();

    }

}


/* =========================================================
   BUTTONS
========================================================= */

startButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        startGame();

    }
);


restartButton.addEventListener(
    "click",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        startGame();

    }
);


document
.getElementById("leftBtn")
.addEventListener(
    "pointerdown",
    moveLeft
);


document
.getElementById("rightBtn")
.addEventListener(
    "pointerdown",
    moveRight
);


document
.getElementById("jumpBtn")
.addEventListener(
    "pointerdown",
    jump
);


/* =========================================================
   SWIPES
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener(
    "touchstart",
    function(e){

        if(!running) return;

        const t =
        e.touches[0];

        touchStartX =
        t.clientX;

        touchStartY =
        t.clientY;

    },
    {passive:false}
);


canvas.addEventListener(
    "touchend",
    function(e){

        if(!running) return;

        const t =
        e.changedTouches[0];

        const dx =
        t.clientX-touchStartX;

        const dy =
        t.clientY-touchStartY;

        if(
            Math.max(
                Math.abs(dx),
                Math.abs(dy)
            ) < 25
        ) return;

        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            dx>0
            ? moveRight()
            : moveLeft();

        }else{

            if(dy<0)
                jump();

        }

    },
    {passive:false}
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key==="ArrowLeft")
            moveLeft();

        if(e.key==="ArrowRight")
            moveRight();

        if(
            e.key==="ArrowUp" ||
            e.key===" "
        )
            jump();

        if(
            e.key==="Enter" &&
            !running
        )
            startGame();

    }
);


/* =========================================================
   SKY
========================================================= */

function drawSky(){

    const gradient =
    ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(
        0,
        "#061a2b"
    );

    gradient.addColorStop(
        .45,
        "#08704b"
    );

    gradient.addColorStop(
        1,
        "#0a2419"
    );

    ctx.fillStyle =
    gradient;

    ctx.fillRect(
        0,0,W,H
    );


    /* SUN */

    ctx.beginPath();

    ctx.arc(
        W*.78,
        H*.17,
        45,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    "#ffd75a";

    ctx.shadowColor =
    "#ffd75a";

    ctx.shadowBlur = 40;

    ctx.fill();

    ctx.shadowBlur = 0;


    drawCloud(
        W*.18,
        H*.17,
        .8
    );

    drawCloud(
        W*.55,
        H*.10,
        .55
    );

}


function drawCloud(x,y,s){

    ctx.fillStyle =
    "rgba(255,255,255,.15)";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+28*s,
        y-8*s,
        32*s,
        0,
        Math.PI*2
    );

    ctx.arc(
        x+60*s,
        y,
        23*s,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =========================================================
   BUILDINGS
========================================================= */

function drawBuildings(){

    const horizon =
    H*.42;

    const colors=[
        "#102c29",
        "#153a35",
        "#183f37",
        "#0d2827",
        "#21433a"
    ];

    for(
        let i=0;
        i<13;
        i++
    ){

        const bw =
        45+(i%4)*20;

        const x =
        (i*85-buildingOffset*.25)
        %(W+120)-60;

        const bh =
        80+(i%5)*35;

        const y =
        horizon-bh;

        ctx.fillStyle =
        colors[i%colors.length];

        ctx.fillRect(
            x,y,bw,bh
        );


        for(
            let wx=x+10;
            wx<x+bw-5;
            wx+=18
        ){

            for(
                let wy=y+15;
                wy<horizon-8;
                wy+=22
            ){

                if(
                    (wx+wy+i)%3!==0
                ){

                    ctx.fillStyle =
                    "rgba(255,220,80,.5)";

                    ctx.fillRect(
                        wx,
                        wy,
                        7,
                        9
                    );

                }

            }

        }

    }

}


/* =========================================================
   PALMS
========================================================= */

function drawPalm(x,y,s){

    ctx.strokeStyle =
    "#39291d";

    ctx.lineWidth =
    7*s;

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.quadraticCurveTo(
        x-5*s,
        y-50*s,
        x+4*s,
        y-95*s
    );

    ctx.stroke();


    const tx =
    x+4*s;

    const ty =
    y-95*s;

    ctx.strokeStyle =
    "#14783d";

    ctx.lineWidth =
    5*s;

    for(
        let i=0;
        i<7;
        i++
    ){

        const angle =
        -Math.PI*.95+
        i*Math.PI*.32;

        ctx.beginPath();

        ctx.moveTo(
            tx,
            ty
        );

        ctx.lineTo(
            tx+
            Math.cos(angle)*40*s,
            ty+
            Math.sin(angle)*25*s
        );

        ctx.stroke();

    }

}


function drawPalms(){

    const ground =
    H*.53;

    drawPalm(
        W*.08,
        ground,
        .8
    );

    drawPalm(
        W*.91,
        ground+5,
        .9
    );

}


/* =========================================================
   ROAD
========================================================= */

function drawRoad(){

    const topY =
    H*.48;

    ctx.fillStyle =
    "#073c25";

    ctx.fillRect(
        0,
        topY,
        W,
        H-topY
    );


    /* ROAD */

    ctx.beginPath();

    ctx.moveTo(
        W*.34,
        topY
    );

    ctx.lineTo(
        W*.66,
        topY
    );

    ctx.lineTo(
        W*.98,
        H
    );

    ctx.lineTo(
        W*.02,
        H
    );

    ctx.closePath();

    ctx.fillStyle =
    "#25282a";

    ctx.fill();


    /* ROAD EDGES */

    ctx.strokeStyle =
    "#f1c63b";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        W*.34,
        topY
    );

    ctx.lineTo(
        W*.02,
        H
    );

    ctx.moveTo(
        W*.66,
        topY
    );

    ctx.lineTo(
        W*.98,
        H
    );

    ctx.stroke();


    /* LANES */

    for(
        let lane=1;
        lane<3;
        lane++
    ){

        const topX =
        W*.34+
        (W*.32/3)*lane;

        const bottomX =
        W*.02+
        (W*.96/3)*lane;

        for(
            let y=
            topY+
            roadOffset%90;
            y<H;
            y+=90
        ){

            const p =
            (y-topY)/
            (H-topY);

            const x =
            topX+
            (bottomX-topX)*p;

            const lineLength =
            22+p*25;

            ctx.strokeStyle =
            "rgba(255,255,255,.65)";

            ctx.lineWidth =
            3+p*3;

            ctx.beginPath();

            ctx.moveTo(
                x,y
            );

            ctx.lineTo(
                x,
                y+lineLength
            );

            ctx.stroke();

        }

    }

}


/* =========================================================
   DANFO
========================================================= */

function drawDanfo(x,y,s){

    ctx.save();

    ctx.translate(x,y);
    ctx.scale(s,s);


    ctx.fillStyle =
    "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        25,
        43,
        10,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
    "#e4b829";

    ctx.beginPath();

    ctx.roundRect(
        -40,
        -45,
        80,
        65,
        9
    );

    ctx.fill();


    ctx.fillStyle =
    "#222";

    ctx.fillRect(
        -40,
        2,
        80,
        18
    );


    ctx.fillStyle =
    "#0b3035";

    ctx.fillRect(
        -32,
        -36,
        23,
        22
    );

    ctx.fillRect(
        -5,
        -36,
        23,
        22
    );

    ctx.fillRect(
        22,
        -36,
        10,
        22
    );


    ctx.fillStyle =
    "#fff0a0";

    ctx.fillRect(
        -38,
        -7,
        7,
        8
    );


    ctx.fillStyle =
    "#111";

    ctx.beginPath();

    ctx.arc(
        -25,
        20,
        10,
        0,
        Math.PI*2
    );

    ctx.arc(
        25,
        20,
        10,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   KEKE
========================================================= */

function drawKeke(x,y,s){

    ctx.save();

    ctx.translate(x,y);
    ctx.scale(s,s);


    ctx.fillStyle =
    "#111";

    ctx.beginPath();

    ctx.arc(
        -19,
        20,
        9,
        0,
        Math.PI*2
    );

    ctx.arc(
        19,
        20,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
    "#e5c532";

    ctx.beginPath();

    ctx.moveTo(
        -32,
        17
    );

    ctx.lineTo(
        -26,
        -27
    );

    ctx.lineTo(
        22,
        -27
    );

    ctx.lineTo(
        34,
        17
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle =
    "#222";

    ctx.fillRect(
        -26,
        -34,
        50,
        7
    );


    ctx.fillStyle =
    "#163c3b";

    ctx.fillRect(
        -20,
        -24,
        17,
        18
    );

    ctx.fillRect(
        2,
        -24,
        17,
        18
    );


    ctx.restore();

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const bob =
    player.jumping
    ? 0
    : Math.sin(player.bob)*3;

    const x =
    player.x;

    const y =
    player.y+bob;


    /* shadow */

    ctx.fillStyle =
    "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
        x,
        player.groundY+5,
        25,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* legs */

    const legMove =
    Math.sin(player.bob)*8;

    ctx.strokeStyle =
    "#111";

    ctx.lineWidth = 8;

    ctx.lineCap =
    "round";

    ctx.beginPath();

    ctx.moveTo(
        x-8,
        y+35
    );

    ctx.lineTo(
        x-10+legMove,
        y+61
    );

    ctx.moveTo(
        x+8,
        y+35
    );

    ctx.lineTo(
        x+10-legMove,
        y+61
    );

    ctx.stroke();


    /* shoes */

    ctx.strokeStyle =
    "#fff";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
        x-16+legMove,
        y+61
    );

    ctx.lineTo(
        x-5+legMove,
        y+61
    );

    ctx.moveTo(
        x+5-legMove,
        y+61
    );

    ctx.lineTo(
        x+16-legMove,
        y+61
    );

    ctx.stroke();


    /* body */

    ctx.fillStyle =
    "#19d86b";

    ctx.beginPath();

    ctx.roundRect(
        x-16,
        y-5,
        32,
        43,
        9
    );

    ctx.fill();


    /* Nigeria stripe */

    ctx.fillStyle =
    "#fff";

    ctx.fillRect(
        x-3,
        y-4,
        6,
        39
    );


    /* head */

    ctx.fillStyle =
    "#75452d";

    ctx.beginPath();

    ctx.arc(
        x,
        y-19,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* hair */

    ctx.fillStyle =
    "#111";

    ctx.beginPath();

    ctx.arc(
        x,
        y-23,
        14,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();


    /* arms */

    ctx.strokeStyle =
    "#75452d";

    ctx.lineWidth = 7;

    ctx.beginPath();

    ctx.moveTo(
        x-13,
        y+4
    );

    ctx.lineTo(
        x-25,
        y+20+legMove
    );

    ctx.moveTo(
        x+13,
        y+4
    );

    ctx.lineTo(
        x+25,
        y+15-legMove
    );

    ctx.stroke();

}


/* =========================================================
   COINS
========================================================= */

function drawCoin(c){

    ctx.save();

    ctx.translate(
        c.x,
        c.y
    );

    const pulse =
    1+
    Math.sin(c.spin)*.12;

    ctx.scale(
        pulse,
        pulse
    );

    ctx.fillStyle =
    "#ffd43b";

    ctx.shadowColor =
    "#ffd43b";

    ctx.shadowBlur = 14;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle =
    "#805900";

    ctx.font =
    "bold 14px Arial";

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.fillText(
        "₦",
        0,
        1
    );

    ctx.restore();

}


/* =========================================================
   SIGNS
========================================================= */

function drawSign(x,y,text){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.fillStyle =
    "#444";

    ctx.fillRect(
        -2,
        0,
        4,
        55
    );


    ctx.fillStyle =
    "#075b32";

    ctx.beginPath();

    ctx.roundRect(
        -34,
        -32,
        68,
        34,
        5
    );

    ctx.fill();


    ctx.strokeStyle =
    "#e7c63c";

    ctx.lineWidth = 2;

    ctx.stroke();


    ctx.fillStyle =
    "#fff";

    ctx.font =
    "bold 10px Arial";

    ctx.textAlign =
    "center";

    ctx.fillText(
        text,
        0,
        -11
    );

    ctx.restore();

}


/* =========================================================
   SPAWN
========================================================= */

function spawnObstacle(){

    const lane =
    Math.floor(
        Math.random()*3
    );

    const type =
    Math.random()>.45
    ? "danfo"
    : "keke";

    obstacles.push({

        lane:lane,

        x:laneX(lane),

        y:H*.48-80,

        scale:
        type==="danfo"
        ? .7
        : .8,

        type:type

    });

}


function spawnCoin(){

    const lane =
    Math.floor(
        Math.random()*3
    );

    coins.push({

        lane:lane,

        x:laneX(lane),

        y:H*.45-100,

        spin:
        Math.random()*10

    });

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(x,y){

    for(
        let i=0;
        i<15;
        i++
    ){

        particles.push({

            x:x,
            y:y,

            vx:
            (Math.random()-.5)*6,

            vy:
            (Math.random()-.5)*6,

            life:1

        });

    }

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
        particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.life -= .035;

        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }

}


function drawParticles(){

    particles.forEach(
        p=>{

            ctx.fillStyle =
            `rgba(255,215,50,${p.life})`;

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt){

    /*
       MUCH SLOWER SPEED SYSTEM
    */

    speed +=
    .00035*dt;

    if(
        speed >
        settings.maxSpeed
    ){

        speed =
        settings.maxSpeed;

    }


    score +=
    speed*.045*dt;


    roadOffset +=
    speed*dt;

    buildingOffset +=
    speed*.5*dt;


    /* Player */

    player.x +=
    (
        player.targetX-player.x
    )*.16;

    player.bob +=
    .30*dt;


    /* Jump */

    if(player.jumping){

        player.y +=
        player.vy*dt;

        player.vy +=
        .8*dt;

        if(
            player.y>=
            player.groundY
        ){

            player.y =
            player.groundY;

            player.vy = 0;

            player.jumping =
            false;

        }

    }


    /* Spawn obstacles */

    obstacleTimer += dt;

    if(
        obstacleTimer >
        settings.obstacleGap
    ){

        spawnObstacle();

        obstacleTimer = 0;

    }


    /* Spawn coins */

    coinTimer += dt;

    if(
        coinTimer >
        settings.coinGap
    ){

        spawnCoin();

        coinTimer = 0;

    }


    /* Obstacles */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o =
        obstacles[i];

        o.y +=
        speed*.72*dt;

        o.x =
        laneX(o.lane);


        /*
           Collision
        */

        const dx =
        Math.abs(
            player.x-o.x
        );

        const dy =
        Math.abs(
            player.y-o.y
        );


        if(
            dx<38 &&
            dy<65 &&
            !player.jumping
        ){

            createParticles(
                player.x,
                player.y
            );

            endGame();

            return;

        }


        if(
            o.y >
            H+120
        ){

            obstacles.splice(
                i,
                1
            );

        }

    }


    /* Coins */

    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const c =
        coins[i];

        c.y +=
        speed*.76*dt;

        c.x =
        laneX(c.lane);

        c.spin +=
        .2*dt;


        if(
            Math.abs(
                player.x-c.x
            )<35 &&
            Math.abs(
                player.y-c.y
            )<60
        ){

            money += 10;

            score += 25;

            coinSound();

            createParticles(
                c.x,
                c.y
            );

            coins.splice(
                i,
                1
            );

            continue;

        }


        if(
            c.y >
            H+80
        ){

            coins.splice(
                i,
                1
            );

        }

    }


    updateParticles();


    scoreEl.textContent =
    Math.floor(score);

    moneyEl.textContent =
    money;


    /*
       Engine changes slightly
       with speed.
    */

    if(
        engineOsc &&
        audioCtx
    ){

        engineOsc.frequency.value =
        45+
        speed*4;

    }

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawSky();

    drawBuildings();

    drawPalms();

    drawRoad();


    drawSign(
        W*.08,
        H*.57,
        "NAIJA"
    );

    drawSign(
        W*.92,
        H*.62,
        "LAGOS"
    );


    obstacles.forEach(
        o=>{

            if(
                o.type==="danfo"
            ){

                drawDanfo(
                    o.x,
                    o.y,
                    o.scale
                );

            }else{

                drawKeke(
                    o.x,
                    o.y,
                    o.scale
                );

            }

        }
    );


    coins.forEach(
        drawCoin
    );


    drawPlayer();

    drawParticles();


    if(running){

        const gradient =
        ctx.createLinearGradient(
            0,
            H*.75,
            0,
            H
        );

        gradient.addColorStop(
            0,
            "rgba(0,255,100,0)"
        );

        gradient.addColorStop(
            1,
            "rgba(0,255,100,.08)"
        );

        ctx.fillStyle =
        gradient;

        ctx.fillRect(
            0,
            H*.75,
            W,
            H*.25
        );

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(timestamp){

    if(!running){

        draw();

        return;

    }


    let dt =
    (timestamp-lastTime)/16.67;

    if(dt>2)
        dt=2;

    lastTime =
    timestamp;


    update(dt);

    draw();


    if(running){

        requestAnimationFrame(
            loop
        );

    }

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

player.groundY =
H-130;

player.x =
laneX(1);

player.targetX =
player.x;

player.y =
player.groundY;

levelDisplay.textContent =
" • NORMAL";

draw();

</script>
