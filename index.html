<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEO RUN: NAIJA</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07130c;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  max-width:700px;
  overflow:hidden;
  background:#111;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:10;
  pointer-events:none;
}

.hudBox{
  background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.22);
  color:white;
  padding:7px 11px;
  border-radius:12px;
  font-weight:bold;
  font-size:13px;
  backdrop-filter:blur(5px);
}

#brand{
  color:#72ff9b;
  font-size:15px;
}

#soundBtn{
  position:absolute;
  right:12px;
  top:62px;
  z-index:20;
  border:0;
  color:white;
  background:rgba(0,0,0,.55);
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.overlay{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:22px;
  background:linear-gradient(
    rgba(0,15,8,.28),
    rgba(0,0,0,.78)
  );
}

.panel{
  width:min(430px,94%);
  text-align:center;
  color:white;
  padding:28px 20px;
  border-radius:24px;
  background:rgba(3,16,9,.82);
  border:1px solid rgba(112,255,150,.3);
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
}

.logo{
  font-size:34px;
  font-weight:1000;
  letter-spacing:1px;
  color:#65ff91;
  text-shadow:0 4px 20px rgba(45,255,100,.25);
}

.subtitle{
  margin-top:7px;
  color:#ddd;
  font-size:14px;
}

.flag{
  width:70px;
  height:38px;
  margin:18px auto;
  display:flex;
  border-radius:7px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.25);
}

.flag span{
  flex:1;
}

.flag span:nth-child(1),
.flag span:nth-child(3){
  background:#008751;
}

.flag span:nth-child(2){
  background:white;
}

.levelTitle{
  margin-top:10px;
  margin-bottom:9px;
  color:#aaa;
  font-size:12px;
  letter-spacing:2px;
}

.levels{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.levelBtn{
  flex:1;
  padding:12px 4px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  color:white;
  background:#15251b;
  font-weight:bold;
  cursor:pointer;
}

.levelBtn.active{
  background:#008751;
  border-color:#63ff91;
  box-shadow:0 0 16px rgba(0,135,81,.5);
}

#startBtn,
#restartBtn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#00a85a,#007d3d);
  color:white;
  font-weight:900;
  font-size:17px;
  box-shadow:0 8px 22px rgba(0,135,81,.3);
  cursor:pointer;
}

.help{
  margin-top:14px;
  font-size:11px;
  color:#aaa;
  line-height:1.5;
}

.hidden{
  display:none !important;
}

#controls{
  position:absolute;
  bottom:18px;
  left:0;
  right:0;
  z-index:15;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.control{
  width:62px;
  height:62px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.42);
  color:white;
  font-size:25px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(5px);
  user-select:none;
  touch-action:none;
}

.control:active{
  transform:scale(.93);
  background:rgba(0,135,81,.75);
}

#jump{
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,135,81,.7);
}

.smallInfo{
  color:#83ffad;
  margin-top:8px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="hudBox" id="brand">🇳🇬 NEO RUN</div>
  <div class="hudBox">₦ <span id="coins">0</span></div>
  <div class="hudBox">SCORE <span id="score">0</span></div>
</div>

<button id="soundBtn">🔊</button>

<div id="startOverlay" class="overlay">
  <div class="panel">

    <div class="logo">NEO RUN: NAIJA</div>
    <div class="subtitle">Run the streets. Collect the Naira. Survive Nigeria.</div>

    <div class="flag">
      <span></span><span></span><span></span>
    </div>

    <div class="levelTitle">SELECT DIFFICULTY</div>

    <div class="levels">
      <button class="levelBtn active" data-level="easy">EASY</button>
      <button class="levelBtn" data-level="normal">NORMAL</button>
      <button class="levelBtn" data-level="hard">HARD</button>
    </div>

    <button id="startBtn">▶ START RUN</button>

    <div class="smallInfo">
      🎵 Afrobeats mode enabled
    </div>

    <div class="help">
      Swipe or use the buttons to move.<br>
      Avoid vehicles • Collect ₦ coins • Jump over danger
    </div>

  </div>
</div>

<div id="gameOverOverlay" class="overlay hidden">
  <div class="panel">

    <div class="logo">GAME OVER</div>

    <div class="subtitle" style="margin-top:15px">
      Your score
    </div>

    <div id="finalScore"
         style="font-size:42px;font-weight:1000;margin:8px">
      0
    </div>

    <div class="smallInfo">
      Best: <span id="bestScore">0</span>
    </div>

    <br>

    <button id="restartBtn">↻ RUN AGAIN</button>

  </div>
</div>

<div id="controls">

  <div class="controlGroup">
    <div class="control" id="left">◀</div>
    <div class="control" id="right">▶</div>
  </div>

  <div class="controlGroup">
    <div class="control" id="jump">▲</div>
  </div>

</div>

</div>

<script>
"use strict";

/* =========================================================
   NEO RUN: NAIJA
   Complete mobile endless runner
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const game = document.getElementById("game");

const scoreEl = document.getElementById("score");
const coinsEl = document.getElementById("coins");
const finalScoreEl = document.getElementById("finalScore");
const bestScoreEl = document.getElementById("bestScore");

const startOverlay = document.getElementById("startOverlay");
const gameOverOverlay = document.getElementById("gameOverOverlay");

const startBtn = document.getElementById("startBtn");
const restartBtn = document.getElementById("restartBtn");
const soundBtn = document.getElementById("soundBtn");

let W = 0;
let H = 0;
let dpr = 1;

function resize(){

  const rect = game.getBoundingClientRect();

  W = rect.width;
  H = rect.height;

  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize", resize);
resize();

/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx = null;
let soundOn = true;
let musicTimer = null;
let musicStep = 0;

function ensureAudio(){

  if(!soundOn) return;

  try{

    if(!audioCtx){
      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }

    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

  }catch(e){
    audioCtx = null;
  }
}

function tone(freq, duration, type="sine", volume=.08, slide=0){

  if(!soundOn || !audioCtx) return;

  try{

    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(freq, now);

    if(slide){
      osc.frequency.linearRampToValueAtTime(
        freq + slide,
        now + duration
      );
    }

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(
      Math.max(volume,0.001),
      now + .015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      now + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + duration + .03);

  }catch(e){}
}

function jumpSound(){
  tone(420,.12,"square",.055,220);
}

function coinSound(){

  tone(850,.07,"sine",.07,250);

  setTimeout(()=>{
    tone(1200,.08,"sine",.055,180);
  },45);
}

function crashSound(){

  tone(90,.35,"sawtooth",.12,-50);

  setTimeout(()=>{
    tone(55,.3,"square",.08,-25);
  },70);
}

function startSound(){

  tone(220,.12,"square",.055,100);

  setTimeout(()=>{
    tone(330,.12,"square",.055,120);
  },100);

  setTimeout(()=>{
    tone(500,.18,"square",.07,180);
  },210);
}

/* Afrobeats-style simple rhythm */
function startMusic(){

  if(!soundOn || !audioCtx) return;

  stopMusic();

  musicStep = 0;

  musicTimer = setInterval(()=>{

    if(!running || !soundOn) return;

    const step = musicStep % 8;

    if(step === 0 || step === 4){
      tone(105,.08,"sine",.035);
    }

    if(step === 2 || step === 6){
      tone(180,.055,"triangle",.025);
    }

    if(step === 1 || step === 5){
      tone(320,.045,"square",.018);
    }

    musicStep++;

  },170);
}

function stopMusic(){

  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

/* =========================================================
   DIFFICULTY
   ========================================================= */

const levels = {

  easy:{
    name:"EASY",
    speed:2.45,
    maxSpeed:3.75,
    spawn:1.55,
    coin:0.72
  },

  normal:{
    name:"NORMAL",
    speed:3.05,
    maxSpeed:4.75,
    spawn:1.28,
    coin:.66
  },

  hard:{
    name:"HARD",
    speed:3.75,
    maxSpeed:5.9,
    spawn:.98,
    coin:.56
  }

};

let selectedLevel = "easy";
let settings = levels.easy;

/* =========================================================
   GAME STATE
   ========================================================= */

let running = false;
let lastTime = 0;

let speed = settings.speed;
let score = 0;
let coins = 0;

let spawnTimer = 0;
let coinTimer = 0;

let roadOffset = 0;

let objects = [];
let particles = [];

let highScore =
  Number(localStorage.getItem("neoNaijaHighScore") || 0);

/* =========================================================
   PLAYER
   ========================================================= */

const player = {

  lane:1,
  targetLane:1,

  x:0,
  jump:0,
  jumpVelocity:0,

  bob:0
};

function resetPlayer(){

  player.lane = 1;
  player.targetLane = 1;
  player.x = laneX(1,.94);

  player.jump = 0;
  player.jumpVelocity = 0;

  player.bob = 0;
}

/* =========================================================
   ROAD / PERSPECTIVE
   ========================================================= */

function horizonY(){
  return H * .39;
}

function roadBottomY(){
  return H * 1.04;
}

function roadWidthAt(z){

  const top = W * .10;
  const bottom = W * 1.08;

  return top + (bottom-top) * z;
}

function roadLeftAt(z){

  return W/2 - roadWidthAt(z)/2;
}

function laneX(lane,z){

  const left = roadLeftAt(z);
  const width = roadWidthAt(z);

  return left + width * ((lane + .5) / 3);
}

function perspectiveY(z){

  const hy = horizonY();
  const by = roadBottomY();

  return hy + (by-hy) * Math.pow(z,1.72);
}

/* =========================================================
   OBJECT CREATION
   ========================================================= */

function addObstacle(){

  const lane = Math.floor(Math.random()*3);

  let type;

  const r = Math.random();

  if(r < .52){
    type = "danfo";
  }else if(r < .82){
    type = "keke";
  }else{
    type = "car";
  }

  objects.push({
    type,
    lane,
    z:.03,
    hit:false
  });
}

function addCoin(){

  const lane = Math.floor(Math.random()*3);

  objects.push({
    type:"coin",
    lane,
    z:.02,
    hit:false
  });
}

/* =========================================================
   PARTICLES
   ========================================================= */

function particle(x,y,color){

  particles.push({
    x,
    y,
    vx:(Math.random()-.5)*3,
    vy:(Math.random()-.5)*3,
    life:1,
    size:Math.random()*5+2,
    color
  });
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p = particles[i];

    p.x += p.vx * dt * 20;
    p.y += p.vy * dt * 20;

    p.vy += .12 * dt;

    p.life -= .045 * dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha = Math.max(0,p.life);

    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* =========================================================
   DRAW HELPERS
   ========================================================= */

function roundRect(x,y,w,h,r,fill,stroke){

  ctx.beginPath();

  ctx.moveTo(x+r,y);

  ctx.lineTo(x+w-r,y);

  ctx.quadraticCurveTo(x+w,y,x+w,y+r);

  ctx.lineTo(x+w,y+h-r);

  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);

  ctx.lineTo(x+r,y+h);

  ctx.quadraticCurveTo(x,y+h,x,y+h-r);

  ctx.lineTo(x,y+r);

  ctx.quadraticCurveTo(x,y,x+r,y);

  if(fill){
    ctx.fill();
  }

  if(stroke){
    ctx.stroke();
  }
}

/* =========================================================
   BACKGROUND
   ========================================================= */

function drawSky(){

  const grad = ctx.createLinearGradient(0,0,0,H);

  grad.addColorStop(0,"#42bff5");
  grad.addColorStop(.55,"#a9e8ff");
  grad.addColorStop(1,"#f4d58c");

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  /* sun */

  ctx.fillStyle="rgba(255,218,93,.8)";

  ctx.beginPath();
  ctx.arc(W*.82,H*.17,38,0,Math.PI*2);
  ctx.fill();

  /* clouds */

  drawCloud(W*.15,H*.15,1);
  drawCloud(W*.58,H*.11,.75);
}

function drawCloud(x,y,s){

  ctx.fillStyle="rgba(255,255,255,.82)";

  ctx.beginPath();

  ctx.arc(x,y,18*s,0,Math.PI*2);
  ctx.arc(x+20*s,y-7*s,25*s,0,Math.PI*2);
  ctx.arc(x+43*s,y,18*s,0,Math.PI*2);

  ctx.fill();
}

/* =========================================================
   CITY / NIGERIAN ROADSIDE
   ========================================================= */

function drawBuildings(){

  const hy = horizonY();

  const buildings = [
    [0,.17,55,"#d87b54"],
    [.10,.23,42,"#e8b45f"],
    [.18,.16,62,"#b75d48"],
    [.27,.20,48,"#9c6c52"],
    [.72,.20,58,"#c36c49"],
    [.82,.15,43,"#e2a857"],
    [.89,.24,65,"#a84d43"]
  ];

  for(const b of buildings){

    const x=W*b[0];
    const width=W*b[1];
    const h=b[2];

    ctx.fillStyle=b[3];

    ctx.fillRect(
      x,
      hy-h,
      width,
      h
    );

    ctx.fillStyle="rgba(255,235,170,.65)";

    for(let yy=hy-h+10;yy<hy-8;yy+=17){

      for(let xx=x+8;xx<x+width-7;xx+=15){

        ctx.fillRect(xx,yy,6,7);
      }
    }
  }
}

function drawPalm(x,y,s){

  ctx.strokeStyle="#6b4829";
  ctx.lineWidth=5*s;

  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.quadraticCurveTo(
    x-4*s,
    y-35*s,
    x+3*s,
    y-70*s
  );
  ctx.stroke();

  ctx.fillStyle="#087c3f";

  for(let i=0;i<7;i++){

    const a =
      i/7*Math.PI*2;

    ctx.beginPath();

    ctx.moveTo(x+3*s,y-70*s);

    ctx.lineTo(
      x+3*s+Math.cos(a)*35*s,
      y-70*s+Math.sin(a)*20*s
    );

    ctx.lineTo(
      x+3*s+Math.cos(a+.25)*28*s,
      y-70*s+Math.sin(a+.25)*18*s
    );

    ctx.fill();
  }
}

function drawRoadside(){

  const hy = horizonY();

  /* grass */

  ctx.fillStyle="#4d8b3c";

  ctx.fillRect(
    0,
    hy,
    W,
    H-hy
  );

  drawBuildings();

  drawPalm(W*.055,hy+65,1);
  drawPalm(W*.94,hy+72,.9);

  /* fuel station */

  const sx=W*.72;
  const sy=hy+12;

  ctx.fillStyle="#e8e8e8";
  ctx.fillRect(sx,sy,58,38);

  ctx.fillStyle="#008751";
  ctx.fillRect(sx-4,sy,66,8);

  ctx.fillStyle="#111";
  ctx.font="bold 9px Arial";
  ctx.fillText("NAIJA",sx+12,sy+25);

  /* roadside sign */

  ctx.fillStyle="#444";
  ctx.fillRect(W*.25,hy+7,3,36);

  ctx.fillStyle="#008751";
  roundRect(W*.20,hy-2,65,24,4,true);

  ctx.fillStyle="white";
  ctx.font="bold 10px Arial";
  ctx.fillText("LAGOS →",W*.20+8,hy+14);
}

/* =========================================================
   ROAD
   ========================================================= */

function drawRoad(){

  const hy = horizonY();

  const leftTop=W/2-W*.05;
  const rightTop=W/2+W*.05;

  const leftBottom=-W*.04;
  const rightBottom=W*1.04;

  /* asphalt */

  ctx.fillStyle="#33383b";

  ctx.beginPath();

  ctx.moveTo(leftTop,hy);
  ctx.lineTo(rightTop,hy);
  ctx.lineTo(rightBottom,H);
  ctx.lineTo(leftBottom,H);
  ctx.closePath();

  ctx.fill();

  /* road edges */

  ctx.lineWidth=5;

  ctx.strokeStyle="#f5d33b";

  ctx.beginPath();
  ctx.moveTo(leftTop,hy);
  ctx.lineTo(leftBottom,H);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(rightTop,hy);
  ctx.lineTo(rightBottom,H);
  ctx.stroke();

  /* lane markings */

  for(let i=0;i<16;i++){

    const z1=(i/16 + roadOffset*.012)%1;
    const z2=Math.min(z1+.045,1);

    const y1=perspectiveY(z1);
    const y2=perspectiveY(z2);

    for(let lane=1;lane<=2;lane++){

      const x1=
        roadLeftAt(z1)+
        roadWidthAt(z1)*(lane/3);

      const x2=
        roadLeftAt(z2)+
        roadWidthAt(z2)*(lane/3);

      ctx.strokeStyle="rgba(255,255,255,.75)";
      ctx.lineWidth=2+z1*5;

      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }

  /* road shine */

  const g=ctx.createLinearGradient(
    0,hy,
    0,H
  );

  g.addColorStop(0,"rgba(255,255,255,.04)");
  g.addColorStop(.7,"rgba(255,255,255,0)");
  g.addColorStop(1,"rgba(255,255,255,.08)");

  ctx.fillStyle=g;

  ctx.beginPath();

  ctx.moveTo(leftTop,hy);
  ctx.lineTo(rightTop,hy);
  ctx.lineTo(rightBottom,H);
  ctx.lineTo(leftBottom,H);
  ctx.closePath();

  ctx.fill();
}

/* =========================================================
   OBJECT DRAWING
   ========================================================= */

function drawCoin(x,y,s){

  ctx.save();

  ctx.translate(x,y);

  const spin =
    Math.abs(Math.sin(performance.now()/160));

  ctx.scale(.45+spin*.55,1);

  ctx.fillStyle="#ffd52e";

  ctx.beginPath();
  ctx.arc(0,0,18*s,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#fff3a0";
  ctx.lineWidth=2*s;

  ctx.stroke();

  ctx.fillStyle="#087c3f";
  ctx.font=`bold ${15*s}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText("₦",0,1);

  ctx.restore();
}

function drawVehicle(x,y,s,type){

  ctx.save();

  ctx.translate(x,y);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.28)";

  ctx.beginPath();
  ctx.ellipse(
    0,
    26*s,
    38*s,
    10*s,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  if(type==="danfo"){

    /* body */

    ctx.fillStyle="#f4c928";

    roundRect(
      -34*s,
      -50*s,
      68*s,
      78*s,
      9*s,
      true
    );

    /* green stripe */

    ctx.fillStyle="#087c3f";

    ctx.fillRect(
      -34*s,
      -15*s,
      68*s,
      12*s
    );

    /* windows */

    ctx.fillStyle="#182b35";

    roundRect(
      -27*s,
      -41*s,
      54*s,
      22*s,
      4*s,
      true
    );

    ctx.fillStyle="#9bd8ed";

    ctx.fillRect(
      -23*s,
      -38*s,
      21*s,
      14*s
    );

    ctx.fillRect(
      2*s,
      -38*s,
      21*s,
      14*s
    );

    /* wheels */

    drawWheel(-25*s,24*s,s);
    drawWheel(25*s,24*s,s);

    ctx.fillStyle="white";
    ctx.font=`bold ${7*s}px Arial`;
    ctx.textAlign="center";
    ctx.fillText("LAGOS",0,3*s);

  }else if(type==="keke"){

    ctx.fillStyle="#087c3f";

    roundRect(
      -30*s,
      -38*s,
      60*s,
      62*s,
      8*s,
      true
    );

    ctx.fillStyle="#e5e5e5";

    ctx.beginPath();
    ctx.moveTo(-23*s,-38*s);
    ctx.lineTo(0,-58*s);
    ctx.lineTo(23*s,-38*s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#17323b";

    roundRect(
      -18*s,
      -31*s,
      36*s,
      22*s,
      4*s,
      true
    );

    drawWheel(-22*s,20*s,s);
    drawWheel(22*s,20*s,s);

  }else{

    ctx.fillStyle="#d9363e";

    roundRect(
      -34*s,
      -45*s,
      68*s,
      70*s,
      12*s,
      true
    );

    ctx.fillStyle="#1c323d";

    roundRect(
      -25*s,
      -36*s,
      50*s,
      24*s,
      5*s,
      true
    );

    ctx.fillStyle="#8dd3e7";

    ctx.fillRect(
      -20*s,
      -32*s,
      18*s,
      15*s
    );

    ctx.fillRect(
      2*s,
      -32*s,
      18*s,
      15*s
    );

    drawWheel(-25*s,22*s,s);
    drawWheel(25*s,22*s,s);
  }

  ctx.restore();
}

function drawWheel(x,y,s){

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(x,y,10*s,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#aaa";

  ctx.beginPath();
  ctx.arc(x,y,4*s,0,Math.PI*2);
  ctx.fill();
}

/* =========================================================
   PLAYER
   ========================================================= */

function drawPlayer(){

  const z=.94;

  const x =
    player.x +
    (laneX(player.targetLane,z)-player.x)*0;

  const y =
    perspectiveY(z) -
    player.jump;

  const bob =
    Math.sin(player.bob)*2;

  ctx.save();

  ctx.translate(x,y+bob);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.beginPath();
  ctx.ellipse(
    0,
    8,
    30,
    9,
    0,
    0,
    Math.PI*2
  );
  ctx.fill();

  /* legs */

  ctx.strokeStyle="#172019";
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-8,-4);
  ctx.lineTo(-11,24);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(8,-4);
  ctx.lineTo(12,24);
  ctx.stroke();

  /* shoes */

  ctx.fillStyle="#111";

  roundRect(-20,19,18,8,3,true);
  roundRect(5,19,18,8,3,true);

  /* body */

  ctx.fillStyle="#087c3f";

  roundRect(-20,-47,40,48,10,true);

  /* white stripe */

  ctx.fillStyle="white";
  ctx.fillRect(-20,-25,40,10);

  /* arms */

  ctx.strokeStyle="#9a603d";
  ctx.lineWidth=8;

  ctx.beginPath();
  ctx.moveTo(-17,-38);
  ctx.lineTo(-29,-14);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(17,-38);
  ctx.lineTo(29,-14);
  ctx.stroke();

  /* head */

  ctx.fillStyle="#9a603d";

  ctx.beginPath();
  ctx.arc(0,-60,18,0,Math.PI*2);
  ctx.fill();

  /* hair */

  ctx.fillStyle="#17120f";

  ctx.beginPath();
  ctx.arc(0,-66,18,Math.PI,Math.PI*2);
  ctx.fill();

  /* eyes */

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(-6,-61,2,0,Math.PI*2);
  ctx.arc(6,-61,2,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt){

  /* slow controlled acceleration */

  speed += .012 * dt;

  if(speed > settings.maxSpeed){
    speed=settings.maxSpeed;
  }

  roadOffset += speed*dt;

  score += speed * dt * 1.35;

  /* player */

  const targetX=laneX(player.targetLane,.94);

  player.x +=
    (targetX-player.x) *
    Math.min(1,.18*dt);

  player.bob += .15*dt;

  if(player.jump > 0 || player.jumpVelocity > 0){

    player.jump += player.jumpVelocity * dt;

    player.jumpVelocity -= .9 * dt;

    if(player.jump <= 0){

      player.jump=0;
      player.jumpVelocity=0;
    }
  }

  /* obstacles */

  spawnTimer -= dt/60;
  coinTimer -= dt/60;

  if(spawnTimer<=0){

    addObstacle();

    spawnTimer =
      settings.spawn *
      (.8+Math.random()*.45);
  }

  if(coinTimer<=0){

    addCoin();

    coinTimer =
      settings.coin *
      (.75+Math.random()*.5);
  }

  for(let i=objects.length-1;i>=0;i--){

    const o=objects[i];

    o.z += speed * .0092 * dt;

    if(o.z>1.15){

      objects.splice(i,1);
      continue;
    }

    const x=laneX(o.lane,o.z);
    const y=perspectiveY(o.z);

    /* collision zone */

    if(
      o.z>.82 &&
      o.z<1.02 &&
      o.lane===player.targetLane
    ){

      if(o.type==="coin"){

        coins++;

        score+=35;

        coinSound();

        for(let j=0;j<8;j++){
          particle(x,y,"#ffd52e");
        }

        objects.splice(i,1);

      }else{

        /* jumping avoids vehicles */

        if(player.jump < 28){

          endGame();
          return;

        }
      }
    }
  }

  updateParticles(dt);

  scoreEl.textContent=Math.floor(score);
  coinsEl.textContent=coins;
}

/* =========================================================
   DRAW OBJECTS
   ========================================================= */

function drawObjects(){

  const sorted=[...objects].sort(
    (a,b)=>a.z-b.z
  );

  for(const o of sorted){

    const x=laneX(o.lane,o.z);
    const y=perspectiveY(o.z);

    const s=.18 + o.z*.98;

    if(o.type==="coin"){

      drawCoin(
        x,
        y-20*s,
        s
      );

    }else{

      drawVehicle(
        x,
        y,
        s,
        o.type
      );
    }
  }
}

/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  drawSky();

  drawRoadside();

  drawRoad();

  drawObjects();

  drawPlayer();

  drawParticles();

  /* top speed indicator */

  if(running){

    ctx.fillStyle="rgba(0,0,0,.35)";

    roundRect(
      12,
      H-105,
      110,
      27,
      8,
      true
    );

    ctx.fillStyle="white";
    ctx.font="bold 11px Arial";

    ctx.fillText(
      settings.name+" • "+speed.toFixed(1),
      22,
      H-87
    );
  }
}

/* =========================================================
   GAME START / END
   ========================================================= */

function resetGame(){

  objects=[];
  particles=[];

  score=0;
  coins=0;

  speed=settings.speed;

  spawnTimer=.8;
  coinTimer=.5;

  roadOffset=0;

  resetPlayer();

  scoreEl.textContent="0";
  coinsEl.textContent="0";
}

function startGame(){

  ensureAudio();

  resetGame();

  running=true;

  startOverlay.classList.add("hidden");
  gameOverOverlay.classList.add("hidden");

  startSound();

  setTimeout(()=>{
    if(running) startMusic();
  },350);

  lastTime=performance.now();

  requestAnimationFrame(loop);
}

function endGame(){

  if(!running) return;

  running=false;

  stopMusic();

  crashSound();

  finalScoreEl.textContent=Math.floor(score);

  if(score>highScore){

    highScore=Math.floor(score);

    localStorage.setItem(
      "neoNaijaHighScore",
      highScore
    );
  }

  bestScoreEl.textContent=highScore;

  gameOverOverlay.classList.remove("hidden");
}

/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(now){

  if(!running){

    draw();
    return;
  }

  let dt=(now-lastTime)/16.67;

  if(dt>2) dt=2;

  if(dt<0) dt=0;

  lastTime=now;

  update(dt);

  draw();

  if(running){
    requestAnimationFrame(loop);
  }
}

/* =========================================================
   CONTROLS
   ========================================================= */

function moveLeft(){

  if(!running) return;

  player.targetLane=
    Math.max(
      0,
      player.targetLane-1
    );
}

function moveRight(){

  if(!running) return;

  player.targetLane=
    Math.min(
      2,
      player.targetLane+1
    );
}

function jump(){

  if(!running) return;

  if(player.jump===0){

    player.jump=1;
    player.jumpVelocity=10;

    jumpSound();
  }
}

/* Mobile buttons */

function buttonControl(element,action){

  element.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      try{
        element.setPointerCapture(e.pointerId);
      }catch(_){}

      action();
    },
    {passive:false}
  );
}

buttonControl(
  document.getElementById("left"),
  moveLeft
);

buttonControl(
  document.getElementById("right"),
  moveRight
);

buttonControl(
  document.getElementById("jump"),
  jump
);

/* Keyboard */

window.addEventListener("keydown",e=>{

  if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
    e.preventDefault();
    moveLeft();
  }

  if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
    e.preventDefault();
    moveRight();
  }

  if(
    e.key==="ArrowUp" ||
    e.key===" " ||
    e.key.toLowerCase()==="w"
  ){
    e.preventDefault();
    jump();
  }
});

/* Swipe */

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener(
  "touchstart",
  e=>{

    const t=e.changedTouches[0];

    touchStartX=t.clientX;
    touchStartY=t.clientY;

  },
  {passive:true}
);

canvas.addEventListener(
  "touchend",
  e=>{

    const t=e.changedTouches[0];

    const dx=t.clientX-touchStartX;
    const dy=t.clientY-touchStartY;

    if(Math.abs(dx)>35){

      if(dx>0){
        moveRight();
      }else{
        moveLeft();
      }

    }else if(dy<-35){

      jump();
    }

  },
  {passive:true}
);

/* =========================================================
   BUTTONS
   ========================================================= */

document.querySelectorAll(".levelBtn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".levelBtn")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    selectedLevel=btn.dataset.level;

    settings=levels[selectedLevel];
  });
});

/*
   pointerdown + click protection:
   pointerdown starts the game immediately from the
   user's gesture, which also helps mobile audio.
*/

let startPressed=false;

function handleStart(e){

  e.preventDefault();

  if(startPressed) return;

  startPressed=true;

  startGame();

  setTimeout(()=>{
    startPressed=false;
  },500);
}

startBtn.addEventListener(
  "pointerdown",
  handleStart,
  {passive:false}
);

restartBtn.addEventListener(
  "pointerdown",
  handleStart,
  {passive:false}
);

/* fallback click for browsers that don't fire pointerdown */

startBtn.addEventListener("click",e=>{
  e.preventDefault();
  if(!running && startOverlay.classList.contains("hidden")===false){
    if(!startPressed) startGame();
  }
});

restartBtn.addEventListener("click",e=>{
  e.preventDefault();
  if(!running){
    startGame();
  }
});

/* =========================================================
   SOUND BUTTON
   ========================================================= */

soundBtn.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    soundOn=!soundOn;

    soundBtn.textContent=
      soundOn ? "🔊" : "🔇";

    if(soundOn){

      ensureAudio();

      if(running){
        startMusic();
        tone(600,.08,"sine",.04);
      }

    }else{

      stopMusic();
    }
  },
  {passive:false}
);

/* =========================================================
   INITIAL DRAW
   ========================================================= */

resetPlayer();
draw();

</script>
