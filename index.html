<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Neo Run: Naija 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#72c9ff;
  font-family:Arial,sans-serif;
  touch-action:none;
}
#game{position:fixed;inset:0}
canvas{display:block}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:20;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}
.hud{
  background:rgba(0,0,0,.48);
  color:white;
  padding:8px 12px;
  border-radius:12px;
  font-weight:bold;
  font-size:15px;
  text-shadow:2px 2px 4px #000;
  margin-bottom:5px;
}
#leftHud,#rightHud{display:flex;flex-direction:column}

#mission{
  position:fixed;
  top:85px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  color:white;
  background:rgba(0,0,0,.48);
  padding:7px 14px;
  border-radius:15px;
  font-size:13px;
  text-align:center;
  pointer-events:none;
}

#controls{
  position:fixed;
  bottom:15px;
  left:0;
  right:0;
  z-index:30;
  display:flex;
  justify-content:center;
  gap:12px;
}
.control{
  width:62px;
  height:55px;
  border:0;
  border-radius:16px;
  background:rgba(0,0,0,.52);
  color:#fff;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 5px 16px rgba(0,0,0,.4);
}
.control:active{transform:scale(.9)}

#menu,#gameover{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  color:white;
  background:linear-gradient(
    rgba(0,20,45,.15),
    rgba(0,0,0,.7)
  );
}
#gameover{display:none}

h1{
  font-size:clamp(40px,12vw,75px);
  text-shadow:0 7px 22px #000;
  letter-spacing:2px;
}
h2{
  font-size:48px;
  text-shadow:0 6px 18px #000;
}
.subtitle{
  margin:8px 0 28px;
  font-size:18px;
}
.start{
  padding:16px 40px;
  border:0;
  border-radius:17px;
  background:#087fd1;
  color:white;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 8px 25px #0008;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div id="leftHud">
    <div class="hud" id="score">SCORE: 0</div>
    <div class="hud" id="distance">DISTANCE: 0m</div>
    <div class="hud" id="lives">❤️❤️❤️</div>
  </div>

  <div id="rightHud">
    <div class="hud" id="coins">🪙 0</div>
    <div class="hud" id="multiplier">×1</div>
    <div class="hud" id="power">POWER: NONE</div>
  </div>
</div>

<div id="mission">
  Mission: Collect 15 coins
</div>

<div id="controls">
  <button class="control" id="left">◀</button>
  <button class="control" id="jump">▲</button>
  <button class="control" id="slide">▼</button>
  <button class="control" id="right">▶</button>
</div>

<div id="menu">
  <h1>NEO RUN</h1>
  <div class="subtitle">NAIJA • EXTREME 3D RUNNER</div>
  <button class="start" id="start">START RUN</button>
</div>

<div id="gameover">
  <h2>GAME OVER</h2>
  <div class="subtitle" id="final"></div>
  <button class="start" id="restart">RUN AGAIN</button>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.186.1/+esm";


/* =====================================================
   SCENE
===================================================== */

const scene=new THREE.Scene();

scene.background=
  new THREE.Color(0x78cfff);

scene.fog=new THREE.Fog(
  0x78cfff,
  35,
  150
);

const camera=
  new THREE.PerspectiveCamera(
    62,
    innerWidth/innerHeight,
    .1,
    300
  );

camera.position.set(
  0,5.4,10
);

const renderer=
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
  new THREE.HemisphereLight(
    0xcaf0ff,
    0x294b25,
    2.2
  )
);

const sun=
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  -35,45,25
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);


/* =====================================================
   MATERIALS
===================================================== */

const roadMat=
  new THREE.MeshStandardMaterial({
    color:0x292b2f,
    roughness:.9
  });

const grassMat=
  new THREE.MeshStandardMaterial({
    color:0x26752e
  });

const whiteMat=
  new THREE.MeshStandardMaterial({
    color:0xffffff
  });


/* =====================================================
   ROAD
===================================================== */

const road=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      12,.25,260
    ),
    roadMat
  );

road.position.set(
  0,0,-110
);

road.receiveShadow=true;

scene.add(road);


/* =====================================================
   GRASS
===================================================== */

const grass1=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      70,.2,260
    ),
    grassMat
  );

grass1.position.set(
  -41,-.12,-110
);

scene.add(grass1);

const grass2=grass1.clone();

grass2.position.x=41;

scene.add(grass2);


/* =====================================================
   LANE LINES
===================================================== */

const laneLines=[];

for(let z=0;z>-260;z-=10){

  for(const x of[-2,2]){

    const m=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .12,.03,4
        ),
        whiteMat
      );

    m.position.set(
      x,.16,z
    );

    scene.add(m);
    laneLines.push(m);
  }
}


/* =====================================================
   BUILDINGS
===================================================== */

function building(x,z){

  const h=
    5+Math.random()*15;

  const w=
    4+Math.random()*5;

  const d=
    4+Math.random()*5;

  const colors=[
    0x777777,
    0x8b7355,
    0x516778,
    0x9c7956,
    0x58616a,
    0x84654c
  ];

  const b=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      new THREE.MeshStandardMaterial({
        color:
          colors[
            Math.floor(
              Math.random()*colors.length
            )
          ]
      })
    );

  b.position.set(
    x,h/2,z
  );

  b.castShadow=true;

  scene.add(b);

  /* windows */

  for(
    let y=2;
    y<h-1;
    y+=2.5
  ){

    const win=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          w*.7,.35,.05
        ),
        new THREE.MeshBasicMaterial({
          color:0xffdb5c
        })
      );

    win.position.set(
      x,y,z-d/2-.03
    );

    scene.add(win);
  }
}

for(
  let z=-15;
  z>-250;
  z-=14
){

  building(
    -12-Math.random()*10,
    z
  );

  building(
    12+Math.random()*10,
    z-7
  );
}


/* =====================================================
   PALMS
===================================================== */

function palm(x,z){

  const g=
    new THREE.Group();

  const trunk=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .25,.42,5,10
      ),
      new THREE.MeshStandardMaterial({
        color:0x70431f
      })
    );

  trunk.position.y=2.5;
  trunk.castShadow=true;

  g.add(trunk);

  for(let i=0;i<8;i++){

    const leaf=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .2,.08,3.7
        ),
        new THREE.MeshStandardMaterial({
          color:0x168536
        })
      );

    leaf.position.y=5.2;
    leaf.rotation.y=
      i*Math.PI*2/8;

    g.add(leaf);
  }

  g.position.set(
    x,0,z
  );

  scene.add(g);
}

for(
  let z=-20;
  z>-250;
  z-=22
){

  palm(-8.5,z);
  palm(8.5,z-10);
}


/* =====================================================
   PLAYER
===================================================== */

function createPlayer(){

  const g=
    new THREE.Group();

  /* torso */

  const torso=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .48,.9,8,16
      ),
      new THREE.MeshStandardMaterial({
        color:0x087fd1
      })
    );

  torso.position.y=1.65;
  torso.castShadow=true;

  g.add(torso);


  /* neck */

  const neck=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .18,.18,.22,12
      ),
      new THREE.MeshStandardMaterial({
        color:0x754126
      })
    );

  neck.position.y=2.35;

  g.add(neck);


  /* head */

  const head=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .48,24,24
      ),
      new THREE.MeshStandardMaterial({
        color:0x754126
      })
    );

  head.position.y=2.8;
  head.castShadow=true;

  g.add(head);


  /* hair */

  const hair=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .5,20,12,
        0,Math.PI*2,
        0,Math.PI*.43
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

  hair.position.y=2.96;

  g.add(hair);


  /* eyes */

  const eyeMat=
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });

  for(const x of[-.17,.17]){

    const eye=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .055,8,8
        ),
        eyeMat
      );

    eye.position.set(
      x,2.82,.44
    );

    g.add(eye);
  }


  /* limbs */

  const skin=
    new THREE.MeshStandardMaterial({
      color:0x754126
    });

  const pants=
    new THREE.MeshStandardMaterial({
      color:0x20252b
    });


  const leftArm=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .13,.7,6,10
      ),
      skin
    );

  const rightArm=leftArm.clone();

  leftArm.position.set(
    -.68,1.65,0
  );

  rightArm.position.set(
    .68,1.65,0
  );

  g.add(
    leftArm,
    rightArm
  );


  const leftLeg=
    new THREE.Mesh(
      new THREE.CapsuleGeometry(
        .16,.72,6,10
      ),
      pants
    );

  const rightLeg=leftLeg.clone();

  leftLeg.position.set(
    -.24,.65,0
  );

  rightLeg.position.set(
    .24,.65,0
  );

  g.add(
    leftLeg,
    rightLeg
  );


  /* shoes */

  const shoeMat=
    new THREE.MeshStandardMaterial({
      color:0x111111
    });

  const shoe1=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .38,.16,.65
      ),
      shoeMat
    );

  const shoe2=shoe1.clone();

  shoe1.position.set(
    -.24,.15,.12
  );

  shoe2.position.set(
    .24,.15,.12
  );

  g.add(
    shoe1,
    shoe2
  );


  g.userData.leftArm=leftArm;
  g.userData.rightArm=rightArm;
  g.userData.leftLeg=leftLeg;
  g.userData.rightLeg=rightLeg;

  return g;
}

const player=createPlayer();

player.position.set(
  0,0,5
);

scene.add(player);


/* =====================================================
   GAME STATE
===================================================== */

const lanes=[
  -4,
  0,
  4
];

let lane=1;

let playing=false;

let speed=.45;

let score=0;
let coins=0;
let distance=0;

let lives=3;

let multiplier=1;

let combo=0;

let shield=false;
let magnet=false;
let doubleScore=false;

let jumpY=0;
let jumping=false;

let sliding=false;

let spawnTimer=0;
let coinTimer=0;
let powerTimer=0;

let missionCoins=0;

let objects=[];


/* =====================================================
   UI
===================================================== */

function updateUI(){

  document.getElementById("score")
    .textContent=
    "SCORE: "+
    Math.floor(score);

  document.getElementById("coins")
    .textContent=
    "🪙 "+coins;

  document.getElementById("distance")
    .textContent=
    "DISTANCE: "+
    Math.floor(distance)+"m";

  document.getElementById("lives")
    .textContent=
    "❤️".repeat(lives);

  document.getElementById("multiplier")
    .textContent=
    "×"+multiplier;

  let p="NONE";

  if(shield)p="🛡️ SHIELD";
  if(magnet)p="🧲 MAGNET";
  if(doubleScore)p="⭐ 2X SCORE";

  document.getElementById("power")
    .textContent=
    "POWER: "+p;

  document.getElementById("mission")
    .textContent=
    "Mission: Collect "+
    Math.max(0,15-missionCoins)+
    " more coins";
}


/* =====================================================
   MOVEMENT
===================================================== */

function left(){

  if(!playing)return;

  lane=Math.max(
    0,lane-1
  );
}

function right(){

  if(!playing)return;

  lane=Math.min(
    2,lane+1
  );
}

function jump(){

  if(
    !playing ||
    jumping ||
    sliding
  )return;

  jumping=true;
  jumpY=0;
}

function slide(){

  if(
    !playing ||
    jumping ||
    sliding
  )return;

  sliding=true;

  player.scale.y=.55;

  setTimeout(()=>{
    sliding=false;
    player.scale.y=1;
  },700);
}


/* =====================================================
   BUTTONS
===================================================== */

leftBtn.onclick=left;
rightBtn.onclick=right;
jumpBtn.onclick=jump;
slideBtn.onclick=slide;

function button(id,fn){
  document
    .getElementById(id)
    .addEventListener(
      "pointerdown",
      fn
    );
}

button("left",left);
button("right",right);
button("jump",jump);
button("slide",slide);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft")
      left();

    if(e.key==="ArrowRight")
      right();

    if(
      e.key==="ArrowUp" ||
      e.key===" "
    )
      jump();

    if(e.key==="ArrowDown")
      slide();
  }
);


/* =====================================================
   SWIPE
===================================================== */

let touchX=0;
let touchY=0;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{
    touchX=e.touches[0].clientX;
    touchY=e.touches[0].clientY;
  },
  {passive:true}
);

renderer.domElement.addEventListener(
  "touchend",
  e=>{

    const dx=
      e.changedTouches[0].clientX-touchX;

    const dy=
      e.changedTouches[0].clientY-touchY;

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(Math.abs(dx)>40){

        if(dx>0)right();
        else left();
      }

    }else{

      if(Math.abs(dy)>40){

        if(dy<0)jump();
        else slide();
      }
    }
  },
  {passive:true}
);


/* =====================================================
   OBSTACLE
===================================================== */

function createObstacle(){

  const l=
    Math.floor(
      Math.random()*3
    );

  const group=
    new THREE.Group();

  const type=
    Math.random();

  let height=1.6;


  /* CAR */

  if(type<.45){

    const body=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.4,1,3.7
        ),
        new THREE.MeshStandardMaterial({
          color:
            [0xd92b2b,
             0x1565c0,
             0xe5b91c,
             0xeeeeee]
            [Math.floor(Math.random()*4)]
        })
      );

    body.position.y=.65;
    body.castShadow=true;

    group.add(body);


    const roof=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.7,.65,1.7
        ),
        new THREE.MeshStandardMaterial({
          color:0x252525
        })
      );

    roof.position.y=1.35;

    group.add(roof);

    height=2;


  }else if(type<.72){

    /* ROAD BARRIER */

    const barrier=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.5,1.2,.8
        ),
        new THREE.MeshStandardMaterial({
          color:0xffb300
        })
      );

    barrier.position.y=.6;
    barrier.castShadow=true;

    group.add(barrier);

    height=1.2;


  }else{

    /* BUS */

    const bus=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          2.6,2.8,5
        ),
        new THREE.MeshStandardMaterial({
          color:0x087f45
        })
      );

    bus.position.y=1.4;
    bus.castShadow=true;

    group.add(bus);

    height=2.8;
  }


  group.position.set(
    lanes[l],
    0,
    -110
  );

  scene.add(group);

  objects.push({
    mesh:group,
    type:"obstacle",
    lane:l,
    height
  });
}


/* =====================================================
   COINS
===================================================== */

function createCoin(){

  const l=
    Math.floor(
      Math.random()*3
    );

  const coin=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .5,.5,.15,32
      ),
      new THREE.MeshStandardMaterial({
        color:0xffd21c,
        metalness:.8,
        roughness:.2
      })
    );

  coin.rotation.x=
    Math.PI/2;

  coin.position.set(
    lanes[l],
    1.6,
    -110
  );

  coin.castShadow=true;

  scene.add(coin);

  objects.push({
    mesh:coin,
    type:"coin",
    lane:l
  });
}


/* =====================================================
   POWER UPS
===================================================== */

function createPower(){

  const l=
    Math.floor(
      Math.random()*3
    );

  const types=[
    "shield",
    "magnet",
    "double"
  ];

  const type=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];

  const colors={
    shield:0x39aaff,
    magnet:0xff3bce,
    double:0xffd21c
  };

  const p=
    new THREE.Mesh(
      new THREE.OctahedronGeometry(
        .75
      ),
      new THREE.MeshStandardMaterial({
        color:colors[type],
        emissive:colors[type],
        emissiveIntensity:.7
      })
    );

  p.position.set(
    lanes[l],
    1.8,
    -110
  );

  scene.add(p);

  objects.push({
    mesh:p,
    type:"power",
    power:type,
    lane:l
  });
}


/* =====================================================
   COLLISION
===================================================== */

function hit(o){

  const sameLane=
    Math.abs(
      o.mesh.position.x-
      player.position.x
    )<1.4;

  const close=
    Math.abs(
      o.mesh.position.z-
      player.position.z
    )<2;

  if(!sameLane || !close)
    return false;


  /* COIN */

  if(o.type==="coin"){

    coins++;
    missionCoins++;

    combo++;

    if(combo>=5)
      multiplier=2;

    if(combo>=10)
      multiplier=3;

    score+=
      100*multiplier;

    scene.remove(o.mesh);

    return true;
  }


  /* POWER */

  if(o.type==="power"){

    if(o.power==="shield")
      shield=true;

    if(o.power==="magnet")
      magnet=true;

    if(o.power==="double")
      doubleScore=true;

    setTimeout(()=>{

      if(o.power==="shield")
        shield=false;

      if(o.power==="magnet")
        magnet=false;

      if(o.power==="double")
        doubleScore=false;

    },8000);

    scene.remove(o.mesh);

    return true;
  }


  /* OBSTACLE */

  if(o.type==="obstacle"){

    const jumpingHigh=
      player.position.y>.9;

    const slidingLow=
      sliding;

    if(
      jumpingHigh ||
      slidingLow
    )
      return false;


    if(shield){

      shield=false;

      combo=0;

      scene.remove(o.mesh);

      return true;
    }


    lives--;

    combo=0;
    multiplier=1;

    scene.remove(o.mesh);

    if(lives<=0)
      gameOver();

    return true;
  }

  return false;
}


/* =====================================================
   MUSIC
===================================================== */

let audio=null;

function startMusic(){

  if(audio)return;

  try{

    audio=
      new (
        window.AudioContext||
        window.webkitAudioContext
      )();

    const notes=[
      261.63,
      329.63,
      392,
      329.63,
      293.66,
      349.23,
      440,
      349.23
    ];

    let i=0;

    setInterval(()=>{

      if(!playing)return;

      const osc=
        audio.createOscillator();

      const gain=
        audio.createGain();

      osc.type="triangle";

      osc.frequency.value=
        notes[i%notes.length];

      gain.gain.setValueAtTime(
        .0001,
        audio.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .03,
        audio.currentTime+.04
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        audio.currentTime+.3
      );

      osc.connect(gain);
      gain.connect(audio.destination);

      osc.start();

      osc.stop(
        audio.currentTime+.34
      );

      i++;

    },350);

  }catch(e){}
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  document
    .getElementById("menu")
    .style.display="none";

  document
    .getElementById("gameover")
    .style.display="none";

  objects.forEach(o=>
    scene.remove(o.mesh)
  );

  objects=[];

  playing=true;

  lane=1;
  speed=.45;

  score=0;
  coins=0;
  distance=0;

  lives=3;

  multiplier=1;
  combo=0;

  shield=false;
  magnet=false;
  doubleScore=false;

  missionCoins=0;

  player.position.set(
    0,0,5
  );

  startMusic();

  updateUI();
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  playing=false;

  document
    .getElementById("final")
    .textContent=
    "Score: "+
    Math.floor(score)+
    " • Coins: "+
    coins+
    " • Distance: "+
    Math.floor(distance)+"m";

  document
    .getElementById("gameover")
    .style.display="flex";
}

document
  .getElementById("start")
  .onclick=startGame;

document
  .getElementById("restart")
  .onclick=startGame;


/* =====================================================
   ANIMATION
===================================================== */

const clock=
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );


  /* PLAYER */

  const targetX=
    lanes[lane];

  player.position.x+=
    (
      targetX-
      player.position.x
    )*
    Math.min(
      1,
      dt*12
    );


  /* JUMP */

  if(jumping){

    jumpY+=
      dt*5.5;

    player.position.y=
      Math.sin(
        jumpY
      )*2.2;

    if(
      jumpY>=Math.PI
    ){

      jumping=false;
      jumpY=0;
      player.position.y=0;
    }
  }


  /* RUN ANIMATION */

  if(playing){

    const t=
      performance.now()*.014;

    const swing=
      Math.sin(t)*.65;

    player.userData.leftArm.rotation.x=
      swing;

    player.userData.rightArm.rotation.x=
      -swing;

    player.userData.leftLeg.rotation.x=
      -swing;

    player.userData.rightLeg.rotation.x=
      swing;
  }


  /* CAMERA */

  camera.position.x+=
    (
      player.position.x*.12-
      camera.position.x
    )*.08;

  camera.lookAt(
    player.position.x*.12,
    1.8,
    -28
  );


  /* GAME */

  if(playing){

    spawnTimer+=dt;
    coinTimer+=dt;
    powerTimer+=dt;

    if(
      spawnTimer>
      Math.max(
        .55,
        1.2-speed
      )
    ){

      createObstacle();

      spawnTimer=0;
    }

    if(
      coinTimer>.58
    ){

      createCoin();

      coinTimer=0;
    }

    if(
      powerTimer>
      8+Math.random()*5
    ){

      createPower();

      powerTimer=0;
    }


    speed+=
      dt*.008;

    distance+=
      speed*dt*9;

    score+=
      dt*
      10*
      multiplier*
      (doubleScore?2:1);


    /* MAGNET */

    if(magnet){

      objects.forEach(o=>{

        if(o.type==="coin"){

          const dx=
            player.position.x-
            o.mesh.position.x;

          const dz=
            player.position.z-
            o.mesh.position.z;

          if(
            Math.abs(dx)<5 &&
            Math.abs(dz)<8
          ){

            o.mesh.position.x+=
              dx*dt*5;

            o.mesh.position.z+=
              dz*dt*5;
          }
        }
      });
    }


    /* OBJECT MOVEMENT */

    for(
      let i=objects.length-1;
      i>=0;
      i--
    ){

      const o=objects[i];

      o.mesh.position.z+=
        speed*35*dt;

      o.mesh.rotation.y+=
        dt*3;


      if(hit(o)){

        objects.splice(i,1);

        continue;
      }


      if(
        o.mesh.position.z>15
      ){

        /* near miss */

        if(
          o.type==="obstacle" &&
          Math.abs(
            o.mesh.position.x-
            player.position.x
          )<3.2
        ){

          score+=
            250*multiplier;
        }

        scene.remove(o.mesh);

        objects.splice(i,1);
      }
    }


    /* ROAD */

    laneLines.forEach(m=>{

      m.position.z+=
        speed*35*dt;

      if(
        m.position.z>10
      )
        m.position.z-=260;
    });


    updateUI();
  }


  renderer.render(
    scene,
    camera
  );
}

animate();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

</script>

</body>
</html>
